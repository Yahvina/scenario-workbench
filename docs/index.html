  // ---- 保存前核对九格：先建单元格，逐行输入直接写入这里（不复制、不补值） ----
  const preview=el('table',{class:'relationships-table'},el('caption',{},'保存前核对：'+sourceLabel+' → '+targetLabel+'，完整 '+sources.length+'×'+targets.length+' 格；缺口保持未判断'));
  preview.append(el('thead',{},el('tr',{},el('th',{scope:'col'},'源 ↓ / 目标 →'),...targets.map(b=>el('th',{scope:'col'},b.label)))));
  const previewBody=el('tbody');
  for(const a of sources){
    const row=el('tr',{},el('th',{scope:'row'},a.label,expert?el('small',{},a.id):null));
    for(const b of targets){
      const cell=el('td',{'data-row-preview-source':a.id,'data-row-preview-target':b.id});
      cells.set(a.id+'\u0000'+b.id,{table:cell,entry:entryFor(a,b)});
      row.append(cell);
    }
    previewBody.append(row);
  }
  preview.append(previewBody);

  // ---- 逐行问答：按传入顺序逐行提问，不重排、不改名 ----
  const rowsHost=el('div',{class:'row-guide-rows'});
  for(const a of sources){
    const targetsText=targets.map(b=>'「'+b.label+'」').join('');
    const article=el('article',{class:'relationships-row','data-row-source':a.id},
      el('p',{class:'row-question'},'当源处于「'+a.label+'」时，它如何直接影响目标处于'+targetsText+'？'),
      expert?el('small',{class:'row-ids'},a.id):null);
    for(const b of targets){
      const key=a.id+'\u0000'+b.id;
      const item=cells.get(key);
      const input=el('input',{type:'number',min:'-3',max:'3',step:'1','data-row-source':a.id,'data-row-target':b.id,'aria-label':'当源处于 '+a.label+' 时，「'+b.label+'」的直接影响评分',placeholder:'未判断'});
      input.value=item.entry.value;
      item.input=input;
      const cell=el('label',{class:'relationships-row-cell'},el('span',{class:'row-cell-label'},b.label,expert?el('small',{},b.id):null),input);
      item.row=cell;
      input.addEventListener('input',event=>{item.entry.value=event.target.value;paintOne(key);refreshReadout();onChange();});
      article.append(cell);
    }
    rowsHost.append(article);
  }
  root.append(el('h4',{class:'row-guide-heading'},'逐行判断：'+sourceLabel+' → '+targetLabel),rowsHost,
    el('h4',{class:'row-guide-heading'},'保存前核对'),el('div',{class:'relationships-scroll',tabindex:'0','aria-label':'逐行判断保存前九格核对表，窄屏可横向滚动'},preview));

  renderOrder();
  paintAll();
  return {root,repaint:paintAll};
}

Object.assign(__exports, { ROW_GUIDE_NOTE, ROW_GUIDE_SCORE_NOTE, ROW_GUIDE_ORDER_NOTE, sketchNode, readRowValue, rowGuide });

"src/modules/relationships/reference.mjs": (__require, __exports) => {
// 参考评分：把“规则/案例”翻译成本项目里可核对的判断草稿。
// 原则：只按因素身份匹配（id 或名称），不按位置硬套；只填参考明确支持的方向；
// 默认只填空白格，0 与已有分值一律不动；覆盖必须另行确认；来源写进依据记录。
const { REFERENCE_PACKS } = __require("src/fixtures/reference-scores.mjs");
const pairKey = (a, b) => a + '|' + b;

function labelOf(project, descriptorId) {
  return project.data.descriptors.find(d => d.id === descriptorId)?.label || descriptorId;
}
function statesOf(project, descriptorId) {
  const d = project.data.descriptors.find(item => item.id === descriptorId);
  return (d?.stateIds || []).map(id => project.data.states.find(s => s.id === id)).filter(Boolean);
}
function byLabel(project, label) {
  return project.data.descriptors.find(d => d.label === label) || null;
}

// 按钮旁的适用范围摘要：不写项目、不算格子分值，只回答“这份参考能覆盖几个方向”。
// 用户应该在点开预览之前就知道它有没有用；完全没有支持规则时返回 none，界面改出手动出路。
function referenceCoverage(project) {
  const ids = project.selection.descriptorIds;
  const total = ids.length * Math.max(0, ids.length - 1);
  if (ids.length < 2) return { state: 'need-factors', pack: null, matched: 0, total };
  const { pack, matchedRules = [] } = pickReferencePack(project);
  if (!pack) return { state: 'none', pack: null, matched: 0, total };
  const matched = pack.level === 'cell'
    ? pack.directions.filter(dir => ids.includes(dir.from) && ids.includes(dir.to)).length
    : matchedRules.length;
  if (!matched) return { state: 'none', pack: null, matched: 0, total };
  return { state: 'ok', pack, matched, total };
}

// 选出能用于当前项目的参考包：机制示例包按 id 命中，旧平台规则按名称命中。
function pickReferencePack(project) {
  const ids = project.selection.descriptorIds;
  const demo = REFERENCE_PACKS.find(pack => pack.id === 'mechanism-demo');
  if (ids.includes('descriptor-a') && ids.includes('descriptor-b')) return { pack: demo, reason: '' };
  const r35 = REFERENCE_PACKS.find(pack => pack.id === 'mechanism-r35');
  if (ids.includes('mech-a') && ids.includes('mech-b')) return { pack: r35, reason: '' };
  // 旧目录与 46 项目录各有一份按名称命中的规则；谁命中的方向多就用谁，不混用两套分值。
  const candidates = ['jjj-airt', 'd46-mapped']
    .map(id => REFERENCE_PACKS.find(pack => pack.id === id))
    .map(pack => ({ pack, hit: pack.rules.filter(rule => byLabel(project, rule.from) && byLabel(project, rule.to)
      && ids.includes(byLabel(project, rule.from).id) && ids.includes(byLabel(project, rule.to).id)) }))
    .filter(item => item.hit.length)
    .sort((a, b) => b.hit.length - a.hit.length);
  if (candidates.length) return { pack: candidates[0].pack, reason: '', matchedRules: candidates[0].hit };
  return { pack: null, reason: '当前因素不在任何参考来源里：机制演示包按示例变量命中；旧平台规则与 46 项映射包按描述符名称命中，名称不在表里就不填。' };
}

// 生成一份“将要填什么”的计划，不写项目。
function referencePlan(project, { year }) {
  const { pack, reason, matchedRules } = pickReferencePack(project);
  if (!pack) return { pack: null, reason, matched: [], skipped: [], totalCells: 0, emptyCells: 0 };
  const region = project.scope.regionId || null;
  const plan = { pack, year, region, years: [...project.scope.years], matched: [], skipped: [], totalCells: 0, emptyCells: 0 };

  const pushDirection = (fromId, toId, score, why, confidence, cells) => {
    if (fromId === toId) return;
    const sources = statesOf(project, fromId), targets = statesOf(project, toId);
    if (!sources.length || !targets.length) {
      plan.skipped.push({ from: fromId, to: toId, reason: '缺少状态定义' });
      return;
    }
    const entries = cells || sources.flatMap(a => targets.map(b => ({ sourceStateId: a.id, targetStateId: b.id, score })));
    const existing = project.data.judgments.find(j => j.sourceDescriptorId === fromId && j.targetDescriptorId === toId
      && j.scope?.regionId === region && Array.isArray(j.validYears) && j.validYears.includes(year));
    const filled = new Map((existing?.entries || []).map(e => [pairKey(e.sourceStateId, e.targetStateId), e.score]));
    let empty = 0, kept = 0;
    for (const e of entries) {
      const has = filled.has(pairKey(e.sourceStateId, e.targetStateId)) && filled.get(pairKey(e.sourceStateId, e.targetStateId)) !== null;
      if (has) kept++; else empty++;
    }
    plan.totalCells += entries.length;
    plan.emptyCells += empty;
    plan.matched.push({
      from: fromId, to: toId, fromLabel: labelOf(project, fromId), toLabel: labelOf(project, toId),
      score, why: why || '', confidence: confidence || '', entries, empty, kept, hasRecord: !!existing
    });
  };

  if (pack.level === 'cell') {
    for (const dir of pack.directions) {
      const from = project.selection.descriptorIds.includes(dir.from) ? dir.from : null;
      const to = project.selection.descriptorIds.includes(dir.to) ? dir.to : null;
      if (!from || !to) { plan.skipped.push({ from: dir.from, to: dir.to, reason: '当前项目没有这两个因素' }); continue; }
      const cells = dir.entries.map(([a, b, score]) => ({ sourceStateId: a, targetStateId: b, score }));
      pushDirection(from, to, null, pack.source, '', cells);
    }
  } else {
    for (const rule of matchedRules) {
      const from = byLabel(project, rule.from), to = byLabel(project, rule.to);
      pushDirection(from.id, to.id, rule.score, rule.why, rule.confidence, null);
    }
  }
  return plan;
}

// 落实计划：默认只填空白；overwrite=true 才覆盖已有分值（调用方必须先确认）。
function applyReference(project, plan, { overwrite = false, newId } = {}) {
  if (!plan?.pack || !plan.matched.length) throw new Error('没有可填入的参考方向');
  const next = structuredClone(project);
  const evidenceId = newId();
  const stamp = new Date().toISOString();
  // 参考规则本身不分年份（描述符级/状态对级都只讲“谁影响谁”），
  // 所以按项目研究年份登记，而不是只写当年——否则换到 2035 就整批“范围不符”。
  const scopeYears = (plan.years && plan.years.length ? plan.years : [plan.year]).slice().sort((a, b) => a - b);
  let filled = 0, created = 0, preserved = 0;
  const ids = [];

  for (const item of plan.matched) {
    let record = next.data.judgments.find(j => j.sourceDescriptorId === item.from && j.targetDescriptorId === item.to
      && j.scope?.regionId === plan.region && Array.isArray(j.validYears) && j.validYears.includes(plan.year)) || null;
    const entries = new Map((record?.entries || []).map(e => [pairKey(e.sourceStateId, e.targetStateId), e.score]));
    let changed = 0;
    for (const cell of item.entries) {
      const key = pairKey(cell.sourceStateId, cell.targetStateId);
      const current = entries.has(key) ? entries.get(key) : null;
      if (current !== null && !overwrite) { preserved++; continue; }
      if (current !== null && overwrite && current === cell.score) continue;
      entries.set(key, cell.score); changed++;
    }
    if (!changed) continue;
    if (!record) {
      record = {
        id: newId(), sourceDescriptorId: item.from, targetDescriptorId: item.to, alternatives: [],
        scope: { regionId: plan.region }, validYears: [...scopeYears], directness: 'unknown', curveEncoding: null,
        entries: [], rationale: '', evidenceRefs: [], reviewStatus: 'draft', version: 1,
        provenance: { origin: 'user', sourceId: plan.pack.id, locator: 'reference:' + plan.pack.id }
      };
      next.data.judgments.push(record);
      created++;
    }
    const sources = statesOf(project, item.from), targets = statesOf(project, item.to);
    record.entries = sources.flatMap(a => targets.map(b => ({
      sourceStateId: a.id, targetStateId: b.id,
      score: entries.has(pairKey(a.id, b.id)) ? entries.get(pairKey(a.id, b.id)) : null
    })));
    record.validYears = [...new Set([...(record.validYears || []), ...scopeYears])].sort((a, b) => a - b);
    record.scope = { ...(record.scope || {}), regionId: record.scope?.regionId || plan.region };
    record.version = record.version + 1;
    record.reviewStatus = 'draft';
    record.rationale = (record.rationale ? record.rationale + '；' : '') + '参考填入（' + plan.pack.label + '）：' + (item.why || plan.pack.source);
    record.evidenceRefs = [...new Set([...(record.evidenceRefs || []), evidenceId])];
    record.provenance = { origin: 'user', sourceId: plan.pack.id, locator: 'reference:' + plan.pack.id };
    filled += changed;
    ids.push(record.id);
  }

  next.data.evidence.push({
    id: evidenceId,
    kind: plan.pack.id === 'mechanism-demo' ? 'fixture' : 'user-assumption',
    sourceId: 'reference:' + plan.pack.id,
    locator: 'reference:' + plan.pack.id + '@' + stamp,
    excerpt: JSON.stringify({
      explanation: '演示参考，可修改，非实时AI生成；采用前须核对，不代表政策结论。',
      pack: plan.pack.label, caseName: plan.pack.caseName, source: plan.pack.source, level: plan.pack.level,
      year: plan.year, region: plan.region,
      directions: plan.matched.map(item => ({ from: item.fromLabel, to: item.toLabel, score: item.score, why: item.why }))
    }),
    reviewStatus: 'draft', version: 1,
    provenance: { origin: 'user', sourceId: plan.pack.id }
  });
  return { next, filled, created, preserved, evidenceId, ids: [...new Set(ids)], years: scopeYears };
}

Object.assign(__exports, { referenceCoverage, pickReferencePack, referencePlan, applyReference });
},

// 保存与导出：首屏只回答两件事——怎么保存方案、能导出什么。
// 列表、比较、模型样例与 AI 草案各自放进可切换区域，不和保存表单堆在同一张长卡里。

const { savePlanPanel, savedWorkPanel, runSavePanel, LIBRARY_EVENT } = __require("src/modules/workspace/saved-work-panel.mjs");
const { createLibrary } = __require("src/modules/workspace/saved-work.mjs");
const { reportPanel } = __require("src/modules/exports/report-panel.mjs");
const { comparePanel } = __require("src/modules/exports/compare-panel.mjs");
const { modelInputPanel } = __require("src/modules/exports/model-input-panel.mjs");
const { aiDraftPanel } = __require("src/modules/exports/ai-draft-panel.mjs");
// 保存状态四态：本机自动保存 / 命名方案 / 检验记录 / 备份文件。
// 各说各的事实，不用一个“已保存”混在一起；只在真正写入后显示成功。
function saveStatusStrip(page, context) {
  const root = el('section', { class: 'save-status', 'aria-label': '保存状态' });
  function render() {
    let plans = 0, runs = 0, libraryOk = true;
    try {
      const storage = 'localStorage' in window ? localStorage : null;
      const state = storage ? createLibrary(storage).load() : null;
      if (state?.ok) { plans = state.bundle.plans.length; runs = state.bundle.runs.length; }
      else if (state && !state.ok) libraryOk = false;
    } catch { libraryOk = false; }
    const persisted = context.persistenceState();
    root.replaceChildren(
      el('div', { class: 'save-chip ' + (persisted.ok ? 'ok' : 'bad') },
        el('b', {}, persisted.ok ? '本机自动保存 · 正常' : '本机自动保存 · 失败'),
        el('span', {}, persisted.ok ? '当前编辑内容每次改动即写入本浏览器；不是云同步。' : '修改只在当前页面，请下载项目备份。')),
      el('div', { class: 'save-chip' + (plans ? ' ok' : '') },
        el('b', {}, '命名方案 ' + plans + ' 份'),
        el('span', {}, '含因素、评分与按年状态；不含检验结果。' + (libraryOk ? '' : ' 本地库暂不可读。'))),
      el('div', { class: 'save-chip' + (runs ? ' ok' : '') },
        el('b', {}, '检验记录 ' + runs + ' 份'),
        el('span', {}, '冻结输入与结果，历史不复算。')),
      el('div', { class: 'save-chip' },
        el('b', {}, '备份文件'),
        el('span', {}, '只在你点「下载」时生成；自动保存不等于已下载备份。')));
  }
  render();
  const offStore = context.store.subscribe(render);
  const offLibrary = () => window.removeEventListener(LIBRARY_EVENT, render);
  window.addEventListener(LIBRARY_EVENT, render);
  page.insertBefore(root, page.querySelector('.exports-grid'));
  return () => { offStore(); offLibrary(); root.remove(); };
}

const VIEWS = [
  { id: 'history', label: '我的方案与历史' },
  { id: 'compare', label: '报告与比较' },
  { id: 'advanced', label: '高级导出与备份' }
];

function mountExports(container, context) {
  const page = el('section', { class: 'exports-page' });
  container.append(page);

  const grid = el('div', { class: 'exports-grid' });
  const planHost = el('div', { class: 'host-plan' });
  const resultHost = el('div', { class: 'host-result' });
  grid.append(planHost, resultHost);
  page.append(
    el('div', { class: 'v5-head' },
      el('h1', {}, '保存与导出'),
      el('p', { class: 'lead' }, '左边保存当前方案；右边保存或导出检验结果。历史记录在下面分区查看。')),
    grid);

  const switchBar = el('div', { class: 'exports-switch', role: 'tablist', 'aria-label': '保存与导出分区' });
  const viewHosts = {};
  const viewWrap = el('div', { class: 'exports-views' });
  for (const view of VIEWS) {
    const host = el('div', { class: 'exports-view', 'data-view': view.id, role: 'tabpanel' });
    viewHosts[view.id] = host;
    viewWrap.append(host);
    const tab = el('button', { class: 'button', role: 'tab', 'aria-selected': 'false', onclick: () => select(view.id) }, view.label);
    tab.dataset.tab = view.id;
    switchBar.append(tab);
  }
  page.append(switchBar, viewWrap);

  function select(id) {
    for (const view of VIEWS) {
      viewHosts[view.id].hidden = view.id !== id;
      const tab = switchBar.querySelector('[data-tab="' + view.id + '"]');
      tab.setAttribute('aria-selected', String(view.id === id));
      tab.classList.toggle('is-current', view.id === id);
    }
  }

  const disposers = [
    saveStatusStrip(page, context),
    savePlanPanel(planHost, context),
    reportPanel(resultHost, context),
    runSavePanel(resultHost, context),
    savedWorkPanel(viewHosts.history, context),
    comparePanel(viewHosts.compare, context),
    modelInputPanel(viewHosts.advanced, context),
    aiDraftPanel(viewHosts.advanced, context)
  ].filter(dispose => typeof dispose === 'function');

  select('history');
  return () => { for (const dispose of disposers) dispose(); };
}

// P8 单独占一个导航入口（专家视角的「AI草案」）。
function mountAiDraft(container, context) {
  const dispose = aiDraftPanel(container, context);
  return typeof dispose === 'function' ? dispose : () => {};
}

Object.assign(__exports, { mountExports, mountAiDraft });
},
"src/modules/exports/report-panel.mjs": (__require, __exports) => {
// 导出结果卡：选一份冻结结果，先预览再下载；报告正文不铺在保存页上。
// 设计要点（与 docs/ROADMAP_V04 的 P5 条目一致）：
// 1. 报告只能从归档生成，不能拿"当前项目"当输入——否则读到的会是编辑中的草稿。
// 2. 当前项目只用来判断"这份归档是否已经过期"，不参与报告内容。
// 3. 未定不是 0：RunResult 为空、count 为 null、状态非 completed 都如实写"未定/未开始"。
const { el } = __require("src/core/ui.mjs");
const { readRunArchive } = __require("src/modules/solver/index.mjs");
const { createLibrary } = __require("src/modules/workspace/saved-work.mjs");
const { buildReport, reportToMarkdown, REPORT_FILENAME } = __require("src/modules/exports/report.mjs");
const { downloadText } = __require("src/modules/exports/download.mjs");
const SESSION_SOURCE = '本次会话的检验结果';

function archiveOptions(context) {
  const options = [];
  const session = readRunArchive(context.store);
  if (session) options.push({ id: 'session', label: SESSION_SOURCE, archive: session });
  let library = null;
  try { library = createLibrary(window.localStorage).load(); } catch (error) { library = { ok: false, error: error.message }; }
  if (library?.ok) for (const item of library.bundle.runs) options.push({ id: item.id, label: '已保存的检验记录：' + item.name, archive: item.archive });
  return { options, library };
}

function reportBody(report) {
  const blocks = [];
  blocks.push(el('p', { class: 'exports-note' },
    report.stale === true ? '过期提示：' + report.staleNote
      : report.stale === false ? '这份结果与当前项目一致。'
        : '无法判断是否过期：' + report.staleNote));
  blocks.push(el('p', { class: 'exports-note' }, '生成时间：' + (report.generatedAt || '未记录（归档没有时间戳）')));
  for (const part of report.sections) {
    blocks.push(el('h3', {}, part.heading));
    for (const line of part.lines) blocks.push(el('p', {}, line));
    if (part.table) blocks.push(el('table', { class: 'exports-table' },
      el('thead', {}, el('tr', {}, ...part.table.head.map(cell => el('th', { scope: 'col' }, cell)))),
      el('tbody', {}, ...part.table.rows.map(cells => el('tr', {}, ...cells.map(cell => el('td', {}, cell)))))));
    blocks.push(el('p', { class: 'exports-source' }, '来源：' + part.source));
  }
  blocks.push(el('h3', {}, '本次没有核到的东西'));
  if (!report.gaps.length) blocks.push(el('p', {}, '没有记录到缺项。这不等于报告已经过核对。'));
  else blocks.push(el('ul', { class: 'exports-gaps' }, ...report.gaps.map(gap => el('li', {}, gap))));
  return blocks;
}

function reportPanel(container, context) {
  const section = el('section', { class: 'exports-card', 'data-report-panel': '' });
  const body = el('div', { 'data-report-body': '' });
  const message = el('p', { class: 'exports-status', role: 'status', 'aria-live': 'polite', 'data-report-status': '' });

  function render() {
    const { options, library } = archiveOptions(context);
    if (!options.length) {
      body.replaceChildren(el('p', { class: 'exports-gaps' },
        library?.ok
          ? '还没有可导出的检验结果：先到「检验与结果」算一次。'
          : '本地历史库无法读取，未做任何改动：' + library.error));
      message.textContent = '';
      return;
    }
    const select = el('select', { id: 'report-archive-source', 'aria-label': '选择要导出的检验结果' },
      ...options.map(option => el('option', { value: option.id }, option.label)));
    const preview = el('button', { class: 'button primary-action', type: 'button' }, '预览报告');
    const download = el('button', { class: 'button', type: 'button' }, '下载 Markdown 报告');
    let current = null;

    function build() {
      const chosen = options.find(option => option.id === select.value) || options[0];
      try { current = buildReport({ project: context.store.read(), archive: chosen.archive, generatedAt: chosen.archive?.RunResult?.createdAt || null }); }
      catch (error) { current = null; message.textContent = '未能生成报告：' + error.message; return true; }
      return false;
    }
    function openPreview() {
      if (build()) return;
      const dialog = el('dialog', { class: 'report-preview', 'aria-label': '报告预览' },
        el('div', { class: 'report-preview-hd' }, el('h3', {}, '报告预览'), el('button', { class: 'button text', type: 'button', onclick: () => dialog.close() }, '关闭')),
        el('div', { class: 'report-preview-body' }, ...reportBody(current)));
      dialog.addEventListener('close', () => dialog.remove());
      document.body.append(dialog);
      dialog.showModal();
      message.textContent = '已按所选结果生成预览；未定项如实写为“未定”，未用 0 顶替。';
    }
    preview.addEventListener('click', openPreview);
    download.addEventListener('click', () => {
      if (build() || !current) return;
      downloadText(REPORT_FILENAME, reportToMarkdown(current), 'text/markdown;charset=utf-8');
    });

    body.replaceChildren(
      el('label', { class: 'save-field' }, '结果来源', select),
      el('p', { class: 'save-hint' }, '报告只读冻结结果；不读取正在编辑的草稿。'),
      el('div', { class: 'save-actions' }, preview, download),
      message);
  }

  const off = context.store.subscribe(render);
  render();
  section.append(el('h3', {}, '导出结果'), body);
  container.append(section);
  return () => off();
}

Object.assign(__exports, { reportPanel });

// P5 一页中文情景报告：纯函数，只从冻结归档读数。
// 为什么只认归档：报告要能被复核，就必须钉住当时那一份输入（scope、修订、因素状态、矩阵覆盖、
// 成立数）。当前项目只用来判断归档是否过期，一个数字都不从它那里取；
// 否则「报告」会随编辑悄悄变形，谁也说不清当初算的是什么。
// 未定与 0 严格分开：RunResult 缺失、count 为 null、状态非 completed 时只写「未定」，
// 绝不落到 0；矩阵里未判断的单元同样不补 0，只报个数。
const REPORT_FILENAME = '情景报告.md';

const STATUS_TEXT = {completed: '已完成', blocked: '阻断', failed: '未完成'};
const ROLE_TEXT = {input: '投入', outcome: '产出', context: '背景'};
const CLASS_TEXT = {block: '阻断', warning: '提示', info: '说明', 'unknown-state': '范围未知'};
const STALE_FIELD_TEXT = {scope: '项目范围', data: '科学数据', selection: '当前选择'};

const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const hasText = value => typeof value === 'string' && value.trim() !== '';
const isCount = value => Number.isInteger(value) && value >= 0;

// 稳定投影：键顺序、视图状态和归档丢掉的 title/id 都不参与过期判定，
// 只比修订号与 scope/data/selection 这三块科学输入。
function canonical(value) {
  if (Array.isArray(value)) return value.map(canonical);
  if (isObject(value)) return Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])]));

}

function staleness(project, snapshot) {
  if (!isObject(project)) return {stale: null, reasons: []};
  const reasons = [];
  if (Number(project.revision) !== Number(snapshot.revision)) {
    reasons.push('修订号 ' + display(project.revision) + ' 与快照 ' + display(snapshot.revision) + ' 不一致');
  }
  for (const key of ['scope', 'data', 'selection']) {
    if (JSON.stringify(canonical(project[key] ?? null)) !== JSON.stringify(canonical(snapshot[key] ?? null))) {
      reasons.push(STALE_FIELD_TEXT[key] + '已变化');

  }
  return {stale: reasons.length > 0, reasons};
}

function display(value) {

  return String(value);
}

function stamp(value) {

  return hasText(value) ? value : null;
}

// 区间按年度详情同一口径书写；未定义区间不乱猜上下界。
function rangeText(range) {
  if (!isObject(range)) return '—（没有数值区间）';
  const {min = null, max = null, minInclusive = false, maxInclusive = false} = range;
  if (typeof min !== 'number' && typeof max !== 'number') return '—（没有数值区间）';
  const left = typeof min === 'number' ? (minInclusive ? '[' : '(') + display(min) : '(−∞';

const descriptorLabel = (data, id) => {
  const found = (data.descriptors || []).find(item => item?.id === id);
  return hasText(found?.label) ? found.label : '未命名因素';
};
const stateLabel = (data, id) => {

function buildReport({project = null, archive = null, generatedAt = null} = {}) {
  if (!isObject(archive)) throw new Error('缺少冻结归档：情景报告只能从归档构造。');
  const snapshot = archive.projectInputSnapshot;
  if (!isObject(snapshot)) throw new Error('归档缺少 projectInputSnapshot：无法确定报告范围。');
  if (!isObject(snapshot.data) || !Array.isArray(snapshot.data.descriptors) || !Array.isArray(snapshot.data.states)) {

  const projectTitle = hasText(snapshot.title) ? snapshot.title : (hasText(snapshot.projectId) ? snapshot.projectId : '未命名项目');
  const title = projectTitle + ' 情景报告';

  // 1. 研究范围：地区、年份、冻结修订。
  const scopeLines = [
    '研究地区：' + (hasText(scope.regionId) ? scope.regionId : '未指定地区（归档未声明）'),
    '研究年份：' + (isObject(archive?.RunInput) && Number.isSafeInteger(archive.RunInput.year) ? archive.RunInput.year + '（本次检算年份）；项目范围年份 ' + (years.length ? years.join('、') : '未声明') : (years.length ? years.join('、') : '未声明年份')),
    '冻结修订：第 ' + display(snapshot.revision) + ' 版',

  ];
  if (!hasText(scope.regionId)) gaps.push('归档快照未声明研究地区：地区未知，不能当通用范围。');
  if (!years.length) gaps.push('归档快照未声明研究年份：年份未知。');
  if (!Number.isSafeInteger(snapshot.revision)) gaps.push('归档快照修订号缺失：无法与当前项目核对是否过期。');
  sections.push({
    id: 'scope', heading: '研究范围', lines: scopeLines,
    source: '冻结的项目范围记录（地区、项目年份、修订号、标题）'
  });

  // 2. 因素与状态定义清单（用标签，括号里保留稳定标识以便回查）。
  const rows = [];
  for (const descriptor of data.descriptors) {
    const states = data.states.filter(state => state?.descriptorId === descriptor?.id);
    const role = ROLE_TEXT[descriptor?.role] || '未声明角色';
    if (!states.length) rows.push([marking(descriptorLabel(data, descriptor?.id), descriptor?.id), '（无状态定义）', role, '—', '—']);

  });

  // 4. 检算结果：count 只在 completed 且为整数时才是数字，其他一律未定。
  const result = archive.RunResult;
  const resultLines = [];
  if (!isObject(result)) {

    if (status === 'completed' && isCount(result.count)) {

    } else {

      resultLines.push('成立数：未定（' + reason + '）；未定不等于 0，本报告不给数字。');
      gaps.push('RunResult 状态为「' + (STATUS_TEXT[status] || status) + '」且成立数未定：不能读作 0 解。');
    }
    if (result.truncated && status !== 'completed') resultLines.push('列表已截断：只展示局部情景，全空间未完成。');
    for (const diagnostic of (Array.isArray(result.diagnostics) ? result.diagnostics : [])) {
      resultLines.push('诊断：' + (hasText(diagnostic?.code) ? diagnostic.code : '未命名诊断') + '：' + (hasText(diagnostic?.message) ? diagnostic.message : '无说明'));

  const activeIds = isObject(input) && Array.isArray(input.activeDescriptorIds) && input.activeDescriptorIds.length

  const scenarioLines = [];
  for (const [index, configuration] of scenarios.slice(0, 5).entries()) {

  } else if (scenarios.length > 5) {

  }
  sections.push({
    id: 'scenarios', heading: '成立情景（前若干条）', lines: scenarioLines,
    source: '本次检算列出的自洽配置与活动因素'
  });

  // 6. 前置诊断与假设确认：结论成立的前提必须写在报告里。
  const boundaryLines = [];
  const acknowledgements = isObject(archive.assumptionAcknowledgements) ? archive.assumptionAcknowledgements : null;
  if (!acknowledgements) {
    boundaryLines.push('原假设确认：未定（归档缺少 assumptionAcknowledgements）。');
    gaps.push('归档缺少假设确认记录：结论的前提未定。');
  } else {
    const current = acknowledgements.currentAssumptions === true;
    const unknown = acknowledgements.unknownStateScope === true;
    boundaryLines.push('按当前草案、依据不足及量表假设检算：' + (current ? '已确认' : '未确认'));
    boundaryLines.push('未声明的状态年份或地区作为当前截面假设：' + (unknown ? '已确认' : '未确认'));
    if (!current) gaps.push('「按当前草案、依据不足及量表假设检算」未确认：结论的前提不完整。');
    if (!unknown) gaps.push('「未声明的状态年份或地区作为当前截面假设」未确认：范围边界未定。');
  }
  const preflight = Array.isArray(archive.preflightDiagnostics) ? archive.preflightDiagnostics : [];
  if (!preflight.length) {
    boundaryLines.push('前置诊断：无记录（不代表没有未声明的范围）。');
  } else {
    const counts = {};
    for (const diagnostic of preflight) {

      counts[key] = (counts[key] || 0) + 1;
    }

    for (const diagnostic of preflight) {
      boundaryLines.push('· ' + (hasText(diagnostic?.message) ? diagnostic.message : '无说明') + '（' + (hasText(diagnostic?.code) ? diagnostic.code : '未命名诊断') + '）');
    }
  }
  boundaryLines.push('报告生成时间：' + (at ?? '未记录（归档没有时间戳）'));
  sections.push({
    id: 'boundary', heading: '前置假设与边界确认', lines: boundaryLines,
    source: '本次检算确认过的假设与前置诊断'
  });

  // 7. 过期与缺项：第 6 条要求——过期必须说清楚，且不偷偷改读当前值。
  const gapLines = [];
  if (stale === true) gapLines.push('归档已过期：当前项目与冻结快照不一致（' + reasons.join('；') + '）。本报告只描述冻结快照，不代表当前项目。');
  else if (stale === null) gapLines.push('未提供当前项目：无法核对归档是否过期，本报告只描述冻结快照。');
  else gapLines.push('归档未过期：当前项目与冻结快照的科学输入一致。');
  gapLines.push('本报告不重新检算，也不读取当前项目的任何数值。');
  gapLines.push('0 与未判断全程区分：0 表示没关系，未判断一律写作「未判断」。');
  gapLines.push(...(gaps.length ? gaps : ['未发现缺项。']));
  sections.push({
    id: 'gaps', heading: '缺项与边界', lines: gapLines,
    source: '冻结结果与当前项目的修订号、范围、数据、选择（只判过期，不取数）'
  });

  const report = {
    title, stale, staleNote: gapLines[0], generatedAt: at,
    sections, gaps: [...gaps], markdown: ''
  };
  report.markdown = reportToMarkdown(report);
  return report;
}

function reportToMarkdown(report) {
  if (!isObject(report)) throw new Error('缺少报告对象：无法输出 Markdown。');
  const lines = ['# ' + (hasText(report.title) ? report.title : '情景报告'), ''];
  const sections = Array.isArray(report.sections) ? report.sections : [];
  for (const section of sections) {
    lines.push('## ' + (hasText(section?.heading) ? section.heading : '未命名小节'), '');
    if (hasText(section?.source)) lines.push('来源：' + section.source, '');
    for (const line of (Array.isArray(section?.lines) ? section.lines : [])) lines.push('- ' + line);
    if (Array.isArray(section?.lines) && section.lines.length) lines.push('');
    const table = section?.table;
    if (Array.isArray(table?.head) && Array.isArray(table?.rows)) {
      lines.push('| ' + table.head.map(cell => cellText(cell)).join(' | ') + ' |');
      lines.push('| ' + table.head.map(() => '---').join(' | ') + ' |');
      for (const row of table.rows) lines.push('| ' + (Array.isArray(row) ? row : []).map(cell => cellText(cell)).join(' | ') + ' |');
      lines.push('');
    }
  }
  if (Array.isArray(report.gaps) && report.gaps.length && !sections.some(section => section?.id === 'gaps')) {
    lines.push('## 缺项与边界', '');
    for (const gap of report.gaps) lines.push('- ' + gap);
    lines.push('');
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trimEnd() + '\n';

// 表格单元格：竖线与换行会破坏 Markdown 表格，转义而不是删字。
const cellText = value => String(value ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');

Object.assign(__exports, { REPORT_FILENAME, buildReport, reportToMarkdown });

"src/modules/exports/download.mjs": (__require, __exports) => {
// 下载辅助：三个导出面板共用一份，避免各自复制一遍 Blob 逻辑。
// 说明：这里只负责把已经生成好的文本交给浏览器，不生成任何内容，
// 所以不会在这里引入"凭空造数"的风险。
function downloadText(filename, text, mime = 'text/plain;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function downloadJson(filename, value) {
  downloadText(filename, JSON.stringify(value, null, 2), 'application/json;charset=utf-8');
}

Object.assign(__exports, { downloadText, downloadJson });
},
"src/modules/exports/compare-panel.mjs": (__require, __exports) => {

// 设计要点：
// 1. 只比较"已经存下来的"东西，不比较编辑中的草稿——否则比较对象会在你打字时漂移。
// 2. 方案比较与结果比较是两件事，不混在一张表里：方案比的是范围/选择/评分，

function readLibrary() {

    if (!state.ok) return { ok: false, error: state.error };
    return { ok: true, bundle: state.bundle };
  } catch (error) {
    return { ok: false, error: error.message };
  }
}

function sideOptions(bundle, kind) {
  return kind === 'plan' ? bundle.plans : bundle.runs;
}

function labelOf(item, kind) {

}

function comparePanel(container, context) {
  const section = el('section', { class: 'exports-module', 'data-compare-panel': '' });
  const message = el('p', { class: 'exports-status', role: 'status', 'aria-live': 'polite', 'data-compare-status': '' });
  const body = el('div', { 'data-compare-body': '' });
  section.append(
    el('h2', {}, '比较两份已保存的方案或结果'),
    el('p', {}, '只比较已经保存下来的方案与归档。编辑中的草稿不参与比较，以免比较对象在输入时变化。'),
    body, message

  function render() {
    const library = readLibrary();

      message.textContent = '';

    const { bundle } = library;

        '本地库里还没有可比较的内容。先在下方「命名方案与本地历史库」保存两份方案或归档，再回到这里比较。'));

      el('option', { value: 'run' }, '比较两份检算结果'));
    const leftSelect = el('select', { id: 'compare-left', 'aria-label': '左侧对象' });
    const rightSelect = el('select', { id: 'compare-right', 'aria-label': '右侧对象' });

    function fillSides() {

      if (!left || !right) {
        output.replaceChildren(el('p', { class: 'exports-gaps' }, '需要两份可读的记录才能比较。'));
        return;
      }
      let result;
      try {
        result = kind === 'plan' ? comparePlans({ left, right }) : compareRuns({ left, right });
      } catch (error) {
        output.replaceChildren(el('p', { class: 'exports-gaps' }, '未能比较：' + error.message));
        return;
      }
      const blocks = [];
      blocks.push(el('p', { class: 'exports-note' }, result.summary));
      if (kind === 'run' && result.historicallyNotRecomputed) {
        blocks.push(el('p', { class: 'exports-gaps' },
          '注意：这里比的是两份历史归档当时算出的结论，不是平台用当前规则重新复算过的结果。旧归档不会被自动重算。'));
      }
      blocks.push(el('table', { class: 'exports-table' },
        el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, '项目'), el('th', { scope: 'col' }, '左侧'), el('th', { scope: 'col' }, '右侧'), el('th', { scope: 'col' }, '是否相同'))),
        el('tbody', {}, ...result.rows.map(item => el('tr', { 'data-compare-row': item.kind },
          el('td', {}, item.label),
          el('td', {}, item.leftText),
          el('td', {}, item.rightText),
          el('td', {}, item.same ? '相同' : '不同'))))));
      if (result.notes?.length) blocks.push(el('ul', { class: 'exports-gaps' }, ...result.notes.map(note => el('li', {}, note))));
      output.replaceChildren(...blocks);
      message.textContent = kind === 'plan'
        ? '方案比较完成：' + result.sameCount + ' 项相同、' + result.changedCount + ' 项不同。'
        : '结果比较完成：' + result.sameCount + ' 项相同、' + result.changedCount + ' 项不同；两份都是历史归档。';
    }

    kindSelect.addEventListener('change', () => { fillSides(); run(); });
    leftSelect.addEventListener('change', run);
    rightSelect.addEventListener('change', run);

    body.replaceChildren(
      el('div', { class: 'exports-row' },
        el('label', { for: 'compare-kind' }, '比较什么'), kindSelect,
        el('label', { for: 'compare-left' }, '左侧'), leftSelect,
        el('label', { for: 'compare-right' }, '右侧'), rightSelect),
      output);
    fillSides();
    run();
  }

  const off = context.store.subscribe(render);
  render();
  container.append(section);
  return () => off();
}

Object.assign(__exports, { comparePanel });
},
"src/modules/exports/compare.mjs": (__require, __exports) => {
// P6 两份方案的对比：纯函数，只把两边已有的内容并排读出来。
// 为什么要单独写「0 与未判断不同」：项目里 0 表示「没关系」，未判断表示「还没有判断」。
// 两者在数值上都会被人看成零，意义却相反，所以本模块绝不把未判断折算成 0，
// 也不因为两边文本都写着 0 之外的空白就判为相同；判断依据是原始分数本身（含 null）。
// 对比同样不做任何检算：归档里的成立数是各自冻结时的历史声明，不是本次重算的结果。
const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const hasText = value => typeof value === 'string' && value.trim() !== '';
const asArray = value => (Array.isArray(value) ? value : []);
const shown = (value, fallback) => (value === null || value === undefined || value === '' ? fallback : String(value));

const STATUS_TEXT = {completed: '已完成', blocked: '阻断', failed: '未完成'};
const ROLE_TEXT = {input: '投入', outcome: '产出', context: '背景'};
// 未判断统一写法；null 与「整条判断缺失」在项目里都读作未判断，所以两者视为同一状态。
const UNJUDGED = '未判断';

const descriptorOf = (data, id) => asArray(data?.descriptors).find(item => item?.id === id) || null;
const stateOf = (data, id) => asArray(data?.states).find(item => item?.id === id) || null;
const descriptorLabel = (data, id) => {
  const found = descriptorOf(data, id);
  return hasText(found?.label) ? found.label : '未命名因素';
};
const stateLabel = (data, id) => {
  const found = stateOf(data, id);
  return hasText(found?.label) ? found.label : '未命名状态';
};

function row(kind, label, leftText, rightText, ids = {}) {
  const same = kind === 'same';
  return {
    kind: same ? 'same' : 'changed', label, leftText, rightText, same,
    id: ids.id ?? null, leftId: ids.leftId ?? null, rightId: ids.rightId ?? null
  };
}

const sameList = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const sorted = list => [...list].sort();

function requireSide(side, kind, field) {
  if (!isObject(side)) throw new Error('缺少对比对象：' + kind + '两侧都必须是对象。');
  if (!isObject(side[field])) throw new Error('缺少' + (field === 'project' ? '方案项目' : '冻结归档') + '：无法对比' + kind + '。');
}

function pairKey(sourceStateId, targetStateId) {
  return JSON.stringify([sourceStateId ?? null, targetStateId ?? null]);
}

// 收集一份数据里所有状态对的原始分数。同一状态对可能出现多条记录：
// 冲突时并排列出，不取平均，也不替调用方选一条。
function pairScores(data) {
  const map = new Map();
  for (const judgment of asArray(data?.judgments)) {
    for (const entry of asArray(judgment?.entries)) {
      if (!isObject(entry)) continue;
      const key = pairKey(entry.sourceStateId, entry.targetStateId);
      if (!map.has(key)) map.set(key, {sourceStateId: entry.sourceStateId ?? null, targetStateId: entry.targetStateId ?? null, values: []});
      const bucket = map.get(key);
      bucket.values.push(entry.score === undefined ? null : entry.score);
      if (!hasText(bucket.sourceDescriptorId) && hasText(judgment?.sourceDescriptorId)) bucket.sourceDescriptorId = judgment.sourceDescriptorId;
      if (!hasText(bucket.targetDescriptorId) && hasText(judgment?.targetDescriptorId)) bucket.targetDescriptorId = judgment.targetDescriptorId;
    }
  }
  return map;
}

// 0 与未判断不同：这里只按原始值分档，null 与缺失都归入「未判断」，
// 但「未判断」与数字 0 永远不相等。
function scoreValues(bucket) {
  if (!bucket) return [UNJUDGED];
  return [...new Set(bucket.values.map(value => (value === null || value === undefined ? UNJUDGED : String(value))))].sort();
}

const scoreText = bucket => scoreValues(bucket).join('、');

const stateLabelOf = (data, id) => stateLabel(data, id);

function comparePlans({left = null, right = null} = {}) {
  requireSide(left, '方案', 'project');
  requireSide(right, '方案', 'project');
  const leftProject = left.project, rightProject = right.project;
  const leftData = isObject(leftProject.data) ? leftProject.data : {};
  const rightData = isObject(rightProject.data) ? rightProject.data : {};
  const rows = [];

  // 标题、范围、修订：最外层身份，先列。
  const leftTitle = hasText(leftProject.title) ? leftProject.title : '未命名项目';
  const rightTitle = hasText(rightProject.title) ? rightProject.title : '未命名项目';
  rows.push(row(leftTitle === rightTitle ? 'same' : 'changed', '项目标题', leftTitle, rightTitle));

  const leftRegion = isObject(leftProject.scope) ? leftProject.scope.regionId : null;
  const rightRegion = isObject(rightProject.scope) ? rightProject.scope.regionId : null;
  rows.push(row(
    leftRegion === rightRegion ? 'same' : 'changed', '研究地区',
    hasText(leftRegion) ? leftRegion : '未声明地区', hasText(rightRegion) ? rightRegion : '未声明地区'
  ));

  const leftYears = asArray(isObject(leftProject.scope) ? leftProject.scope.years : null);
  const rightYears = asArray(isObject(rightProject.scope) ? rightProject.scope.years : null);
  rows.push(row(
    sameList(sorted(leftYears.map(Number)), sorted(rightYears.map(Number))) ? 'same' : 'changed', '研究年份',
    leftYears.length ? leftYears.join('、') : '未声明年份',
    rightYears.length ? rightYears.join('、') : '未声明年份',
    {leftId: leftYears.join(','), rightId: rightYears.join(',')}
  ));

  rows.push(row(
    Number(leftProject.revision) === Number(rightProject.revision) ? 'same' : 'changed', '修订号',
    shown(leftProject.revision, '未定'), shown(rightProject.revision, '未定'),
    {leftId: leftProject.revision ?? null, rightId: rightProject.revision ?? null}
  ));

  // 活动因素：按稳定 ID 比较集合，显示用标签，原始 ID 留在 leftId/rightId。
  const leftSelected = asArray(leftProject.selection?.descriptorIds).filter(hasText);
  const rightSelected = asArray(rightProject.selection?.descriptorIds).filter(hasText);
  const descriptorNames = id => {
    const leftLabel = leftSelected.includes(id) ? descriptorLabel(leftData, id) : null;
    const rightLabel = rightSelected.includes(id) ? descriptorLabel(rightData, id) : null;
    return {leftLabel: leftLabel ?? '未选', rightLabel: rightLabel ?? '未选'};
  };
  rows.push(row(
    sameList(sorted(leftSelected), sorted(rightSelected)) ? 'same' : 'changed', '活动因素',
    leftSelected.length ? leftSelected.map(id => descriptorNames(id).leftLabel).join('、') : '未选',
    rightSelected.length ? rightSelected.map(id => descriptorNames(id).rightLabel).join('、') : '未选',
    {leftId: leftSelected.join(','), rightId: rightSelected.join(',')}
  ));

  // 每个活动因素的关注状态：按因素分别成行，显示状态标签。
  // 因素名称本身也参与比较：名称不同说明两边说的不是同一件事，不能只看 ID。
  const activeUnion = [...new Set([...leftSelected, ...rightSelected])];
  for (const id of activeUnion) {
    const pick = (project, data) => asArray(project.selection?.stateIds)
      .filter(stateId => stateOf(data, stateId)?.descriptorId === id);
    const leftPicked = pick(leftProject, leftData);
    const rightPicked = pick(rightProject, rightData);
    const fold = (picked, data) => (picked.length ? picked.map(stateId => stateLabel(data, stateId)).join('、') : '未选');
    const leftName = leftSelected.includes(id) ? descriptorLabel(leftData, id) : '未选';
    const rightName = rightSelected.includes(id) ? descriptorLabel(rightData, id) : '未选';
    rows.push(row(leftName === rightName ? 'same' : 'changed', '因素名称（' + id + '）', leftName, rightName, {id, leftId: id, rightId: id}));
    rows.push(row(
      sameList(sorted(leftPicked), sorted(rightPicked)) ? 'same' : 'changed',
      '关注状态·' + (leftSelected.includes(id) ? leftName : rightName),
      fold(leftPicked, leftData), fold(rightPicked, rightData),
      {id, leftId: leftPicked.join(','), rightId: rightPicked.join(',')}
    ));
    // 状态定义标签：状态 ID 相同但名称被改过，也是一处真实差异。
    const leftStates = asArray(leftData.states).filter(state => state?.descriptorId === id);
    const rightStates = asArray(rightData.states).filter(state => state?.descriptorId === id);
    const namesOf = states => states.map(state => (hasText(state?.label) ? state.label : '未命名状态'));
    rows.push(row(
      sameList(namesOf(leftStates), namesOf(rightStates)) ? 'same' : 'changed',
      '状态定义·' + (leftSelected.includes(id) ? leftName : rightName),
      namesOf(leftStates).length ? namesOf(leftStates).join('、') : '无状态定义',
      namesOf(rightStates).length ? namesOf(rightStates).join('、') : '无状态定义',
      {id, leftId: leftStates.map(state => state.id).join(','), rightId: rightStates.map(state => state.id).join(',')}
    ));
  }

  // 锁定状态：显示标签；锁定与「关注」是两回事，单独一行。
  const leftLocks = asArray(leftProject.selection?.lockedStateIds).filter(hasText);
  const rightLocks = asArray(rightProject.selection?.lockedStateIds).filter(hasText);
  const lockText = (locks, data) => (locks.length ? locks.map(stateId => stateLabel(data, stateId)).join('、') : '无锁定');
  rows.push(row(
    sameList(sorted(leftLocks), sorted(rightLocks)) ? 'same' : 'changed', '锁定状态',
    lockText(leftLocks, leftData), lockText(rightLocks, rightData),
    {leftId: leftLocks.join(','), rightId: rightLocks.join(',')}
  ));

  // 逐状态对评分：这是本模块的核心规则所在（0 与未判断不同）。
  const leftPairs = pairScores(leftData), rightPairs = pairScores(rightData);
  const pairKeys = [...new Set([...leftPairs.keys(), ...rightPairs.keys()])];
  const pairLabel = key => {
    const sample = leftPairs.get(key) || rightPairs.get(key);
    const data = leftPairs.has(key) ? leftData : rightData;
    const sourceName = descriptorLabel(data, sample.sourceDescriptorId);
    const targetName = descriptorLabel(data, sample.targetDescriptorId);
    return '判断 ' + sourceName + '·' + stateLabelOf(data, sample.sourceStateId) + ' → ' + targetName + '·' + stateLabelOf(data, sample.targetStateId);
  };
  for (const key of pairKeys) {
    const leftBucket = leftPairs.get(key) || null, rightBucket = rightPairs.get(key) || null;
    const leftValues = scoreValues(leftBucket), rightValues = scoreValues(rightBucket);
    rows.push(row(
      sameList(leftValues, rightValues) ? 'same' : 'changed', pairLabel(key),
      scoreText(leftBucket), scoreText(rightBucket),
      {
        id: key,
        leftId: leftBucket ? pairKey(leftBucket.sourceStateId, leftBucket.targetStateId) : null,
        rightId: rightBucket ? pairKey(rightBucket.sourceStateId, rightBucket.targetStateId) : null
      }
    ));
  }

  const sameCount = rows.filter(item => item.same).length;
  const judgmentCount = pairKeys.length;
  const notes = [];
  if (judgmentCount) notes.push('逐状态对评分按原始分数比较：0 表示没关系，未判断单独记为「未判断」，两者不同。');
  if (judgmentCount) notes.push('同一状态对存在多条判断时并排列出，不取平均、不代选。');
  notes.push('本对比只读两份方案的当前内容，不检算、不改分。');
  return {
    rows, sameCount, changedCount: rows.length - sameCount,
    summary: '对比 ' + rows.length + ' 行：相同 ' + sameCount + ' 行、不同 ' + (rows.length - sameCount) + ' 行（左：'
      + (hasText(left.name) ? left.name : '未命名方案') + '；右：' + (hasText(right.name) ? right.name : '未命名方案') + '）。',
    notes
  };
}

function compareRuns({left = null, right = null} = {}) {
  requireSide(left, '归档', 'archive');
  requireSide(right, '归档', 'archive');
  const leftArchive = left.archive, rightArchive = right.archive;
  const leftSnapshot = isObject(leftArchive.projectInputSnapshot) ? leftArchive.projectInputSnapshot : null;
  const rightSnapshot = isObject(rightArchive.projectInputSnapshot) ? rightArchive.projectInputSnapshot : null;
  const leftInput = isObject(leftArchive.RunInput) ? leftArchive.RunInput : null;
  const rightInput = isObject(rightArchive.RunInput) ? rightArchive.RunInput : null;
  const leftResult = isObject(leftArchive.RunResult) ? leftArchive.RunResult : null;
  const rightResult = isObject(rightArchive.RunResult) ? rightArchive.RunResult : null;
  const rows = [];

  // 冻结修订：两份归档各自冻结时的项目修订，不是当前项目。
  const leftRevision = leftSnapshot?.revision, rightRevision = rightSnapshot?.revision;
  rows.push(row(
    Number(leftRevision) === Number(rightRevision) ? 'same' : 'changed', '冻结修订（projectInputSnapshot.revision）',
    shown(leftRevision, '未定'), shown(rightRevision, '未定'),
    {leftId: leftRevision ?? null, rightId: rightRevision ?? null}
  ));

  // 检算年份：RunInput 缺失就是未记录，不猜。
  const leftYear = leftInput?.year, rightYear = rightInput?.year;
  rows.push(row(
    leftYear === rightYear ? 'same' : 'changed', '检算年份（RunInput.year）',
    shown(leftYear, '未记录'), shown(rightYear, '未记录'),
    {leftId: leftYear ?? null, rightId: rightYear ?? null}
  ));

  // 矩阵覆盖：未判断单元只报个数；要求/已判断缺失一律未定。
  const coverageRows = [
    ['应有单元（coverage.required）', coverage => coverage?.required],
    ['已判断单元（coverage.judged）', coverage => coverage?.judged],
    ['未判断单元（coverage.missingPairs）', coverage => (Array.isArray(coverage?.missingPairs) ? coverage.missingPairs.length : null)]
  ];
  const leftCoverage = isObject(leftInput?.matrix?.coverage) ? leftInput.matrix.coverage : null;
  const rightCoverage = isObject(rightInput?.matrix?.coverage) ? rightInput.matrix.coverage : null;
  for (const [label, read] of coverageRows) {
    const leftValue = leftCoverage ? read(leftCoverage) : null;
    const rightValue = rightCoverage ? read(rightCoverage) : null;
    const valueText = value => (Number.isInteger(value) ? String(value) : '未定（归档没有可读的矩阵覆盖）');
    rows.push(row(
      leftValue === rightValue ? 'same' : 'changed', label, valueText(leftValue), valueText(rightValue),
      {leftId: leftValue ?? null, rightId: rightValue ?? null}
    ));
  }

  // 结果状态与成立数。count 只在是整数时才是数字：0 是真实计数，null 是未定。
  const statusText = result => {
    if (!result) return '未开始（没有 RunResult）';
    return STATUS_TEXT[result.status] || '未知状态（' + shown(result.status, '空') + '）';
  };
  rows.push(row(
    statusText(leftResult) === statusText(rightResult) ? 'same' : 'changed', '检算状态（RunResult.status）',
    statusText(leftResult), statusText(rightResult),
    {leftId: leftResult?.status ?? null, rightId: rightResult?.status ?? null}
  ));

  const countText = result => {
    if (!result) return '未定（未开始，不是 0）';
    if (Number.isInteger(result.count)) return String(result.count);
    return '未定（未完成，不是 0）';
  };
  rows.push(row(
    countText(leftResult) === countText(rightResult) ? 'same' : 'changed', '成立数（RunResult.count）',
    countText(leftResult), countText(rightResult),
    {leftId: Number.isInteger(leftResult?.count) ? leftResult.count : null, rightId: Number.isInteger(rightResult?.count) ? rightResult.count : null}
  ));

  // 选用判断：按 id + version 对照，两个字段都进显示与原始字段。
  const selectionMap = archive => {
    const map = new Map();
    for (const item of asArray(archive?.selectionOfJudgments)) {
      if (!isObject(item) || !hasText(item.id)) continue;
      map.set(item.id, item);
    }
    return map;
  };
  const leftSelection = selectionMap(leftArchive), rightSelection = selectionMap(rightArchive);
  const selectionIds = [...new Set([...leftSelection.keys(), ...rightSelection.keys()])];
  for (const id of selectionIds) {
    const leftItem = leftSelection.get(id) || null, rightItem = rightSelection.get(id) || null;
    const describe = item => (item ? (Number.isSafeInteger(item.version) ? 'v' + item.version : '版本未定（v未记录）') : '未选用');
    rows.push(row(
      describe(leftItem) === describe(rightItem) ? 'same' : 'changed', '选用判断 ' + id,
      describe(leftItem), describe(rightItem),
      {id, leftId: leftItem?.version ?? null, rightId: rightItem?.version ?? null}
    ));
  }
  if (!selectionIds.length) {
    rows.push(row('same', '选用判断', '两边都没有选用记录', '两边都没有选用记录'));
  }

  const sameCount = rows.filter(item => item.same).length;
  const changedCount = rows.length - sameCount;
  return {
    rows, sameCount, changedCount, historicallyNotRecomputed: true,
    summary: '对比 ' + rows.length + ' 行：相同 ' + sameCount + ' 行、不同 ' + changedCount + ' 行（左：'
      + (hasText(left.name) ? left.name : '未命名归档') + '；右：' + (hasText(right.name) ? right.name : '未命名归档')
      + '）。这里的修订、年份、覆盖、状态与成立数都取自两份各自冻结的归档，是当时的历史声明；本次没有在任一项目上重新检算。',
    notes: [
      'historicallyNotRecomputed：两边的数字来自两份独立冻结的归档，不是同一次重算的两次读数。',
      '成立数为 null 或未完成时写作「未定」，不写成 0；成立数 0 是真实计数，照写 0。',
      '历史归档只能证明当时声明了什么，不能证明当前项目仍然如此。'
    ]
  };
}

Object.assign(__exports, { comparePlans, compareRuns });
},
"src/modules/exports/model-input-panel.mjs": (__require, __exports) => {
// P9 模型输入样例面板：把 model-mapping.mjs 的纯逻辑接成一屏，让人先看清这份映射的性质，再下载样例。
// 三个界面上的硬要求：
// 1. 「平台推断、未经核对」必须出现在标题下方、就在控件之前，不是在末尾的小字里；
//    下载按钮、预览 JSON 与 CSV 都重复带上它，样例离开本页面后不会变成一份没有标记的参数表。
// 2. 下拉框只列 inputCandidates()：结果型与仅文档型的映射即便能显示，也生成不出样例，
//    列出来只会让人以为它们可用。
// 3. 预览区显示的就是下载的那份 JSON：先看清再下载，下载内容与预览不会不一致。
const { el } = __require("src/core/ui.mjs");
const { MAPPING_PROVENANCE, MAPPING_GAPS, MODEL_INPUT_FILENAME, inputCandidates, mappingFor, buildModelInput, sampleToJson, sampleToCsv } = __require("src/modules/exports/model-mapping.mjs");
// 候选条目的显示文本：名称、真实模型字段、单位三样都要看得见；
// 仅文档型没有真实文件，按「待核」标出；单位为空时如实写「单位未核」，不替它补一个。
function optionText(mapping) {
  const unit = typeof mapping.unit === 'string' && mapping.unit.trim() ? mapping.unit : '单位未核';
  const review = mapping.confidence === 'documented-only' ? '（待核）' : '';
  return mapping.descriptorLabel + '（' + mapping.descriptorId + '）' + review
    + '｜模型字段：' + (mapping.modelField === null || mapping.modelField === undefined ? '未核到' : mapping.modelField)
    + '｜单位：' + unit;
}

const hasText = value => typeof value === 'string' && value.trim() !== '';

function stateOptions(project, descriptorId) {
  const states = Array.isArray(project?.data?.states) ? project.data.states : [];
  return states.filter(state => state?.descriptorId === descriptorId);
}

function modelInputPanel(container, context) {
  const candidates = inputCandidates();
  let currentDescriptorId = candidates.length ? candidates[0].descriptorId : '';

  const root = el('section', {class: 'exports-module', 'data-model-input': ''});

  const statusNote = el('p', {},
    '这份映射是平台侧逐条打开真实模型文件比对出来的：确实核对过文件是否存在、单位是否如此，'
    + '但没有导师或同学确认过，也没有核对过「状态档位如何换算成模型取值」。'
    + '请不要把它当作已核对的参数表引用；样例里每一处都写着「' + MAPPING_PROVENANCE.label + '」。');

  const mappingSelect = el('select', {
    'aria-label': '映射到哪个模型参数',
    onchange: () => { currentDescriptorId = mappingSelect.value; renderStates(); renderPreview(); }
  });
  for (const mapping of candidates) {
    mappingSelect.append(el('option', {value: mapping.descriptorId}, optionText(mapping)));
  }
  if (!candidates.length) mappingSelect.append(el('option', {value: ''}, '没有可用的映射：证据文件里没有核到承载文件的输入型或参数型描述符'));

  const stateSelect = el('select', {
    'aria-label': '选择状态',
    onchange: () => renderPreview()
  });
  const valueInput = el('input', {type: 'number', 'aria-label': '参数取值', step: 'any', oninput: () => renderPreview()});
  const noteInput = el('input', {type: 'text', 'aria-label': '备注', oninput: () => renderPreview()});
  const preview = el('pre', {'data-model-input-preview': '', style: 'white-space:pre-wrap;overflow-wrap:anywhere'});
  const message = el('p', {role: 'status', 'aria-live': 'polite'});

  const button = (name, onClick) => el('button', {class: 'button secondary', type: 'button', onclick: onClick}, name);

  // 下载与预览共用一个构造入口：预览为空时按钮也必须拒绝，不能凭界面上的旧值下载。
  function currentSample() {
    const result = buildModelInput({
      descriptorId: currentDescriptorId,
      project: context.store.read(),
      stateId: stateSelect.value,
      value: valueInput.value,
      note: noteInput.value
    });
    return result;
  }

  function download(name, text, mime) {
    const url = URL.createObjectURL(new Blob([text], {type: mime}));
    const anchor = el('a', {href: url, download: name});
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function renderStates() {
    const project = context.store.read();
    stateSelect.replaceChildren();
    const states = stateOptions(project, currentDescriptorId);
    if (!states.length) {
      stateSelect.append(el('option', {value: ''}, '当前项目里没有这个描述符的状态定义'));
      return;
    }
    stateSelect.append(el('option', {value: ''}, '请选择状态'));
    for (const state of states) stateSelect.append(el('option', {value: state.id}, hasText(state.label) ? state.label : state.id));
  }

  function renderPreview() {
    const result = currentSample();
    if (!result.ok) {
      preview.textContent = '样例还生成不了：' + result.message + '\n（代码 ' + result.code + '）';
      if (message.textContent && message.textContent !== result.message) message.textContent = result.message;
      return '';
    }
    const text = sampleToJson(result.sample);
    preview.textContent = text;
    return text;
  }

  const buttonRow = el('div', {style: 'display:flex;flex-wrap:wrap;gap:8px;margin:8px 0'},
    button('下载模型输入样例', () => {
      const result = currentSample();
      if (!result.ok) { message.textContent = '未下载：' + result.message; renderPreview(); return; }
      download(MODEL_INPUT_FILENAME + '.json', sampleToJson(result.sample), 'application/json');
      message.textContent = '已下载 JSON 样例；文件内已写明「' + MAPPING_PROVENANCE.label + '」。';
    }),
    button('下载模型输入样例（CSV）', () => {
      const result = currentSample();
      if (!result.ok) { message.textContent = '未下载：' + result.message; renderPreview(); return; }
      download(MODEL_INPUT_FILENAME + '.csv', sampleToCsv(result.sample), 'text/csv');
      message.textContent = '已下载 CSV 样例；文件内已写明「' + MAPPING_PROVENANCE.label + '」。';
    }));

  // 未核到清单与映射同等重要：把窟窿摆在样例旁边，避免只看到一条标记就以为映射完整。
  const gapsList = el('ul', {}, ...MAPPING_GAPS.map(gap => el('li', {}, gap)));

  root.append(
    el('h2', {}, '模型输入样例（平台推断）'),
    statusLine,
    statusNote,
    el('label', {style: 'display:block;margin:8px 0'}, '映射到哪个模型参数', mappingSelect),
    el('label', {style: 'display:block;margin:8px 0'}, '选择状态', stateSelect),
    el('label', {style: 'display:block;margin:8px 0'}, '参数取值', valueInput),
    el('label', {style: 'display:block;margin:8px 0'}, '备注（可留空）', noteInput),
    el('h3', {}, '将下载的样例内容'),
    el('p', {}, '下面就是点击下载后会得到的 JSON；它带着来源声明，脱离本页面也读得到映射性质。'),
    preview,
    buttonRow,
    message,
    el('h3', {}, '本次没有核到的东西'),
    el('p', {}, '以下都是平台侧没有核对到的部分，样例不会把它们补上；请勿据此认为映射已经完整。'),
    gapsList,
    el('p', {}, '证据文件：' + MAPPING_PROVENANCE.evidenceDir + MAPPING_PROVENANCE.evidenceFile
      + '；说明文件：' + MAPPING_PROVENANCE.evidenceDir + MAPPING_PROVENANCE.evidenceWriteup + '。')
  );

  container.append(root);
  renderStates();
  renderPreview();
  return root;
}

    platformStatus: 'platform-inference',

// 未核到的东西按原顺序转写：这份清单和映射同等重要，界面必须把它显示在样例旁边，
// 否则「平台推断」就只剩一句标签，看不到推断的具体窟窿在哪里。

  'D05 电网间输电能力与输电成本参数无承载文件；只核到历史省间交易量（GWh）。',

  'CHEER 无法运行：GAMS 为商业软件需授权，本机未找到 gams 可执行文件与任何 .lic/gamslice.txt，因此 CHEER 侧参数只能按源码与 参数说明.xlsx 阅读，未经运行验证。',
  'CHEER-Clean 目录实际为 39 个文件，与源 docx 所称「47 个文件」不一致；CHEER 官网所称 Python 版本未在该包中出现（包内无 .py 文件），Python 版本未核。',

  'configuration.xml 的 ScenarioComponents 区块实测为 115 条 Value 条目（源 docx 称 113 个）；configuration_china_ssp1.xml 为 116 条、ssp2 为 110 条；SSP1 与 SSP2 实测差异为 21 个参数项（源 docx 称 23 个）。数值差异未追到原因。',
  'extdata 下单位核实仅限于本会话打开头部的那批 CSV；未逐个打开全部 1112 个 CSV 的单位行。',
  'CHEER-P-demo 的 trend.gms 不存在（实际为 trend.gdx 等数据文件），CHEER-P 侧的 TFP/劳动力趋势字段只核到 parshock.gms 中的 tfp0。',
  'USDA_GDP_MER.csv（源 docx 4.1 节列出的关键文件）在 extdata 下未找到，只核到 Maddison_population.csv、UN_popTot.csv、pwt91.csv、SSP_database_2024.csv.gz。',
  '本映射为平台侧推断并逐条比对真实文件所得，未经导师确认，不得以「已核对」表述提交给导师。'
];

// 可下载样例的基名；扩展名由调用方决定（.json / .csv）。
const MODEL_INPUT_FILENAME = '模型输入样例';

const hasText = value => typeof value === 'string' && value.trim() !== '';
const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
// 空值口径：null / undefined / 空串 / 纯空白都算「未填写」。0 与 '0' 不在此列，它们是真实取值。
const isBlank = value => value === null || value === undefined || (typeof value === 'string' && value.trim() === '');

// 中文拒绝原因逐条分开：用户要做的下一步并不一样。
const MODEL_INPUT_ERRORS = {
  UNKNOWN_DESCRIPTOR: '证据文件里没有这个编号的映射',
  DOCUMENTED_ONLY: '这条映射只有文档级说法，没有落到具体模型文件',
  NO_SOURCE_FILE: '这条映射没有核到承载文件',
  NO_PROJECT: '当前项目不可读',
  NO_STATE: '没有选择状态',
  UNKNOWN_STATE: '所选状态不属于这个描述符',
  BLANK_VALUE: '参数取值为空',
  INVALID_VALUE: '参数取值不是有限数字',
  UNIT_NOT_IN_EVIDENCE: '映射单位为空，不接受自行填写的单位',
  UNIT_MISMATCH: '声明单位与证据文件不一致'
};

function mappingFor(descriptorId) {
  if (!hasText(descriptorId)) return null;
  return MODEL_MAPPINGS.find(mapping => mapping.descriptorId === descriptorId) || null;
}

// 候选只收「能当模型输入用」的映射：分类是 input 或 parameter，且核到了真实承载文件，
// 且不是仅文档型。结果型（D04/D07）与仅文档型（D07/D10）一律不进候选——
// 它们即便出现在下拉框里也生成不出样例，列出来只会让人以为可用。
function inputCandidates() {
  return MODEL_MAPPINGS.filter(mapping =>
    (mapping.classification === 'input' || mapping.classification === 'parameter') &&
    hasText(mapping.sourceFile) &&
    mapping.confidence !== 'documented-only');
}

function refuse(code, detail) {
  return { ok: false, code, message: MODEL_INPUT_ERRORS[code] + '：' + detail };
}

// 生成一份可下载的模型输入样例。
// 拒绝顺序固定：先看映射本身能不能用（编号、仅文档型、无承载文件），再看项目与状态是否齐备，
// 最后才看取值。这样界面拿到的第一条原因总是最靠近根因的那条。
function buildModelInput({descriptorId, project, stateId, value, unit, note} = {}) {
  const mapping = mappingFor(descriptorId);
  if (!mapping) return refuse('UNKNOWN_DESCRIPTOR', hasText(descriptorId) ? descriptorId : '（未指定编号）');
  if (mapping.confidence === 'documented-only') return refuse('DOCUMENTED_ONLY', mapping.descriptorLabel + '（' + mapping.descriptorId + '）');
  if (!hasText(mapping.sourceFile)) return refuse('NO_SOURCE_FILE', mapping.descriptorLabel + '（' + mapping.descriptorId + '）');
  if (!isObject(project)) return refuse('NO_PROJECT', '无法从项目里读范围与状态');

  const states = Array.isArray(project.data?.states) ? project.data.states : [];
  const candidates = states.filter(state => state?.descriptorId === mapping.descriptorId);
  if (isBlank(stateId)) {
    return refuse('NO_STATE', candidates.length
      ? '请先选择「' + mapping.descriptorLabel + '」的一个状态'
      : '当前项目里没有「' + mapping.descriptorLabel + '」的状态定义，请先在因素与方案里定义');
  }
  const state = candidates.find(item => item.id === stateId) || null;
  if (!state) return refuse('UNKNOWN_STATE', String(stateId) + '（该描述符只有 ' + (candidates.length ? candidates.map(item => item.id).join('、') : '0') + ' 个状态）');

  // 未填写与 0 是两条读法：空值拒绝，0 通过。这里只做一次判定，后面统一用数值。
  if (isBlank(value)) return refuse('BLANK_VALUE', '未填写不等于 0，请填入实际取值或明确填写 0');
  const numeric = Number(typeof value === 'string' ? value.trim() : value);
  if (!Number.isFinite(numeric)) return refuse('INVALID_VALUE', String(value));

  // 调用方若声明了单位，只允许与证据文件一致；证据里单位为空时不接受另外填写，避免自己造单位。
  const declared = hasText(unit) ? unit.trim() : null;
  if (declared !== null) {
    if (!hasText(mapping.unit)) return refuse('UNIT_NOT_IN_EVIDENCE', '证据文件里这条映射的单位为空，不能自行补一个单位');
    if (declared !== mapping.unit) return refuse('UNIT_MISMATCH', '映射单位「' + mapping.unit + '」，声明单位「' + declared + '」');
  }

  const scope = isObject(project.scope) ? project.scope : {};
  const years = Array.isArray(scope.years) ? scope.years.filter(year => typeof year === 'number' && Number.isFinite(year)) : [];
  const sample = {
    schemaVersion: 1,
    kind: 'model-input-sample',
    // 来源声明放在最前面：样例被单独打开、转发或粘进别的文档时，这几行必须跟着它走。
    provenance: {
      status: MAPPING_PROVENANCE.status,
      label: MAPPING_PROVENANCE.label,
      reviewedByMentor: MAPPING_PROVENANCE.reviewedByMentor,
      evidenceFile: MAPPING_PROVENANCE.evidenceFile,
      evidenceWriteup: MAPPING_PROVENANCE.evidenceWriteup,
      note: MAPPING_PROVENANCE.note
    },
    confidence: mapping.confidence,
    descriptor: {
      descriptorId: mapping.descriptorId,
      descriptorLabel: mapping.descriptorLabel,
      classification: mapping.classification,
      model: mapping.model
    },
    // 模型字段、来源文件、单位三项一律取自证据文件，不从界面取、不做归一化改写。
    modelField: mapping.modelField,
    sourceFile: mapping.sourceFile,
    unit: mapping.unit,
    project: {
      id: hasText(project.id) ? project.id : null,
      title: hasText(project.title) ? project.title : null,
      regionId: hasText(scope.regionId) ? scope.regionId : null,
      years
    },
    state: {id: state.id, label: hasText(state.label) ? state.label : null},
    value: numeric,
    note: hasText(note) ? note.trim() : null,
    conversionNote: mapping.conversionNote,
    boundary: mapping.boundary
  };
  return {ok: true, sample};
}

function sampleToJson(sample) {
  return JSON.stringify(sample, null, 2) + '\n';
}

// CSV 只输出一行数据：键与值都是单行文本，多值用顿号连接，便于人工核对与再粘贴。
// 置信度按证据文件原样写出（verified-in-file / documented-only），不翻译成容易被读成「已核对」的中文。
const CSV_COLUMNS = [
  ['描述符编号', sample => sample?.descriptor?.descriptorId],
  ['描述符名称', sample => sample?.descriptor?.descriptorLabel],
  ['分类', sample => sample?.descriptor?.classification],
  ['适用模型', sample => sample?.descriptor?.model],
  ['模型字段', sample => sample?.modelField],
  ['来源文件', sample => sample?.sourceFile],
  ['单位', sample => sample?.unit],
  ['置信度', sample => sample?.confidence],
  ['项目编号', sample => sample?.project?.id],
  ['项目标题', sample => sample?.project?.title],
  ['研究地区', sample => sample?.project?.regionId],
  ['研究年份', sample => (Array.isArray(sample?.project?.years) && sample.project.years.length ? sample.project.years.join('、') : null)],
  ['状态编号', sample => sample?.state?.id],
  ['状态名称', sample => sample?.state?.label],
  ['参数取值', sample => (sample?.value === null || sample?.value === undefined ? null : sample.value)],
  ['备注', sample => sample?.note],
  ['映射状态', sample => sample?.provenance?.label],
  ['导师已核对', sample => (sample?.provenance?.reviewedByMentor === true ? '是' : '否')],
  ['证据文件', sample => sample?.provenance?.evidenceFile],
  ['换算说明', sample => sample?.conversionNote],
  ['适用边界', sample => sample?.boundary]
];

function csvCell(value) {
  if (value === null || value === undefined) return '';
  const text = String(value);
  return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function sampleToCsv(sample) {
  const rows = [
    CSV_COLUMNS.map(([head]) => csvCell(head)).join(','),
    CSV_COLUMNS.map(([, read]) => csvCell(read(sample))).join(',')
  ];
  return rows.join('\r\n') + '\r\n';
}

Object.assign(__exports, { MAPPING_STATUS_LABEL, MAPPING_PROVENANCE, MODEL_MAPPINGS, MAPPING_GAPS, MODEL_INPUT_FILENAME, MODEL_INPUT_ERRORS, mappingFor, inputCandidates, buildModelInput, sampleToJson, sampleToCsv });
},
"src/modules/exports/ai-draft-panel.mjs": (__require, __exports) => {

    el('ul', { class: 'exports-gaps' },
      el('li', {}, '草案只新增待核条目：不写评分、不写数值、不新建或改动描述符与状态、不动时间路径。'),
      el('li', {}, '每条都带出处分级：只在材料里找到原文才算「有出处」，只对上名称的一律标「' + REVIEW_MARK + '」。'),
      el('li', {}, '采用必须由你逐条勾选；被采用的条目写成本地证据记录，出处标为「用户假设」，不冒充政策或论文。')),

// P8 草案模块：把用户提供的一段材料交给本地模型，生成带出处的候选条目，再由用户逐条采用。
// 三条不可越过的边界：
// 1. 传输可注入：requestDraft 只认识 (request)=>response，Node 里用假传输就能覆盖全部失败分支，
//    真实网络只出现在 createOllamaTransport 一层。
// 2. 每条必须有出处：追不到材料或项目描述符的条目一律 source.kind==='unattributed'，界面按「待核」显示，
//    不能当成有依据的内容展示。
// 3. 采用必须由用户显式点选：adoptDraft 只写入 selectedIds 里的条目，且只写成 user-assumption 证据记录，

    output: p.data.judgments.length ? ['覆盖 ' + directions.size + ' 个方向，' + p.data.judgments.reduce((s, j) => s + (j.entries?.length || 0), 0) + ' 个状态对格子'] : ['还没有任何判断'],
    source: 'judgments 集合；每条判断带版本与证据引用',
    gaps: [
      ...(directions.size < need ? ['还有 ' + (need - directions.size) + ' 个方向没有判断'] : []),
      ...(noPaper.length ? [noPaper.length + ' 条判断没有论文或历史数据依据（政策文本不能替代）'] : [])
    ]
  });

  // 6 采用矩阵
  const year = archive?.RunInput?.year ?? (years[0] ?? null);
  let matrixNode;
  if (archive?.RunInput?.matrix) {
    const cov = archive.RunInput.matrix.coverage;
    matrixNode = {
      input: [['年份', archive.RunInput.year], ['矩阵版本', 'v' + archive.RunInput.matrix.version], ['选用记录', archive.selectionOfJudgments.length + ' 条']],
      did: '把该年选用的判断拼成完整矩阵；得分缺失处不补 0。',
      output: ['应判 ' + cov.required + ' 格；已判 ' + cov.judged + '；未判断 ' + cov.missingPairs.length],
      source: '冻结输入 RunInput.matrix · ' + archive.selectionOfJudgments.map(j => j.id + '@v' + j.version).join('、'),
      gaps: cov.missingPairs.length ? ['矩阵有 ' + cov.missingPairs.length + ' 格未判断，不能求解'] : [],
      status: cov.missingPairs.length ? 'gap' : (fresh ? 'ok' : 'stale')
    };

    const { snapshot, diagnostics } = year ? buildMatrix(p, { year, selectedJudgmentIds: [] }) : { snapshot: null, diagnostics: [] };
    matrixNode = {
      input: [['年份', year ?? '未选'], ['评分选用', '还没选评分']],
      did: '只准备矩阵形状与覆盖，不代替你选择记录。',
      output: snapshot ? ['应判 ' + snapshot.coverage.required + ' 格；已判 ' + snapshot.coverage.judged] : ['尚不能准备矩阵'],
      source: '当前项目（未冻结）',
      gaps: ['还没有可检验的评分：到关系页把每个方向填好，再继续到检验页。', ...diagnostics.slice(0, 3).map(d => d.message)],
      status: 'empty'
    };
  }

  // 7 求解
  const run = archive?.RunResult;
  add({
    id: 'solve', no: 7, title: 'CIB 检验', module: 'solver',
    status: !archive ? 'empty' : run?.status === 'completed' ? (fresh ? 'ok' : 'stale') : run?.status === 'blocked' ? 'gap' : 'gap',
    input: [['年份', archive?.RunInput?.year ?? '未开始'], ['枚举上限', archive?.RunInput?.solverConfig?.limit ?? '—'], ['锁定', (archive?.RunInput?.lockedStateIds || []).length + ' 个']],
    did: '逐个枚举配置，对每个变量比较“所选状态”和“任何替代状态”的支持分。',
    output: !run ? ['还没有检算归档'] : [run.status === 'completed' ? '完成：检查 ' + run.checked + ' 个，自洽 ' + run.count + ' 个' : run.status === 'failed' ? '未完成：已检查 ' + run.checked + '，不能报全空间结论' : '阻断：未开始，成立数未定'],
    source: 'RunResult · ' + (archive?.RunInput?.engineVersion || '引擎版本未知') + (archive ? ' · ' + run?.id : ''),
    gaps: !run ? ['尚未运行 CIB'] : run.truncated ? ['展示列表截断：计数完整，但逐条分析只覆盖前 ' + run.scenarios.length + ' 个'] : []
  });

  // 8 解释与对比
  let explainNode = {
    input: [['配置', '未开始'], ['指标', '未计算']], did: '对一份具体配置逐因素解释支持、差距与裕度。',
    output: ['尚无解释'], source: '—', gaps: ['还没有可解释的配置'], status: 'empty'
  };
  if (archive?.RunInput && years.length) {
    const plan = planAtYear(p, archive.RunInput.year);
    if (plan.complete) {
      try {
        const trace = explain(archive.RunInput, plan.config);
        const g = gammaOf(trace);

        explainNode = {
          input: [['配置', Object.entries(plan.config).map(([d, s]) => name(d) + '=' + stateName(s)).join('，')], ['来源', '该年就地选择的状态']],
          did: '逐因素相加支持分，比较所选与替代，并计算有符号裕度与总影响。',
          output: [trace.consistent ? '该配置自洽' : '该配置有 ' + trace.conflicts.length + ' 个冲突：' + trace.conflicts.map(name).join('、'),

          source: '冻结输入 + plan-check 同一算法',
          gaps: trace.consistent ? [] : ['冲突来自矩阵里的具体格子，可回关系页核对'],
          status: fresh ? 'ok' : 'stale'
        };
      } catch (error) {
        explainNode.gaps = ['无法解释：' + error.message];
      }
    } else explainNode.gaps = [archive.RunInput.year + ' 年方案缺 ' + plan.missing.length + ' 个因素，无法解释'];
  }
  add({ id: 'explain', no: 8, title: '解释与指标', module: 'solver', ...explainNode });

  // 9 模型映射与导出
  const maps = p.data.mappings || [];
  add({
    id: 'export', no: 9, title: '模型映射与导出', module: 'exports',
    status: !maps.length ? 'empty' : 'ok',
    input: [['参数映射', maps.length + ' 条'], ['报告', '中文报告 / 对比 / 模型输入']],
    did: '把状态与参数对应到目标模型字段，并生成可核对的导出物。',
    output: ['已实现：结构化参数表、中文报告、模型输入样例、AI 草案；PDF/PPT 未接入'],
    source: 'exports 模块',
    gaps: ['真实 GCAM/CHEER 运行需要模型与许可，当前只有生成样例'],
    status: maps.length ? 'ok' : 'empty'
  });
  return nodes;
}

const CHAIN_STATUS = { ok: ['已接通', 'ok'], gap: ['有缺口', 'warn'], stale: ['已过期', 'warn'], empty: ['未开始', 'bad'] };

Object.assign(__exports, { buildChain, CHAIN_STATUS });

"src/core/analytics.mjs": (__require, __exports) => {
// 结果分析核心：全部从冻结的 RunInput / RunResult 计算，不读当前项目替换历史。
const pairKey = (a, b) => JSON.stringify([a, b]);

function configKey(config, ids) { return ids.map(id => config[id]).join('|'); }

function tisOf(input, config) {
  // config 以变量 ID 为键；先把“本次选中的状态集合”取出来，再配对矩阵格子。
  const chosen = new Set(Object.values(config || {}));
  let sum = 0, cells = 0;
  for (const e of input.matrix.entries) {
    if (e.sourceStateId === e.targetStateId) continue;
    if (chosen.has(e.sourceStateId) && chosen.has(e.targetStateId)) { sum += e.score; cells++; }
  }
  return { sum, cells };
}

// γ 排除所选状态后重新取最大值；单状态不适用，返回 null。
function gammaOf(trace) {
  const rows = trace.balances.map(b => {
    const alts = b.candidates.filter(c => c.stateId !== b.selectedStateId);
    if (!alts.length) return { descriptorId: b.descriptorId, gamma: null, applies: false };
    const best = alts.reduce((m, c) => c.support > m.support ? c : m, alts[0]);
    return { descriptorId: b.descriptorId, gamma: b.selectedSupport - best.support, bestAlternative: best.stateId, applies: true };
  });
  const valued = rows.filter(r => r.applies);
  return { rows, gamma: valued.length ? Math.min(...valued.map(r => r.gamma)) : null, applies: valued.length > 0 };
}

function distribution(run, input) {
  const ids = input.activeDescriptorIds, total = run?.count;
  return ids.map(descriptorId => {
    const counts = run?.stateCounts?.[descriptorId] || {};
    const states = input.matrix.stateIdsByDescriptor[descriptorId] || [];
    return {
      descriptorId, total,
      rows: states.map(stateId => ({ stateId, count: counts[stateId] ?? 0, freq: total ? (counts[stateId] ?? 0) / total : null }))
    };
  });
}

function topStates(run, input, limit = 2) {
  return distribution(run, input).map(d => ({
    descriptorId: d.descriptorId,
    rows: [...d.rows].sort((a, b) => b.count - a.count).slice(0, limit)
  }));
}

function diffSets(baseAll, nextAll, ids) {
  const key = c => configKey(c, ids);
  const base = new Map((baseAll || []).map(c => [key(c), c]));
  const next = new Map((nextAll || []).map(c => [key(c), c]));
  const kept = [...base.keys()].filter(k => next.has(k)).map(k => next.get(k));
  const added = [...next.keys()].filter(k => !base.has(k)).map(k => next.get(k));
  const removed = [...base.keys()].filter(k => !next.has(k)).map(k => base.get(k));
  return { kept, added, removed, baseSize: base.size, nextSize: next.size };
}

// Hamming 距离：两个配置里有几个变量取的状态不同。
function distance(a, b, ids) {
  let d = 0;
  for (const id of ids) if (a[id] !== b[id]) d++;
  return d;
}

// 确定性 k-medoids：初始中心按枚举顺序“最远优先”挑，结果只取决于输入顺序与 k。
function clusters(scenarios, ids, k = 4) {
  if (!scenarios?.length) return { k: 0, clusters: [], method: 'k-medoids / Hamming', limited: false };
  const kk = Math.max(1, Math.min(k, scenarios.length));
  const medoids = [scenarios[0]];
  while (medoids.length < kk) {
    let best = null, bestD = -1;
    for (const s of scenarios) {
      const d = Math.min(...medoids.map(m => distance(m, s, ids)));
      if (d > bestD) { bestD = d; best = s; }
    }
    if (!best) break;
    medoids.push(best);
  }
  const assign = scenarios.map(s => {
    let bi = 0, bd = Infinity;
    medoids.forEach((m, i) => { const d = distance(m, s, ids); if (d < bd) { bd = d; bi = i; } });
    return { index: bi, d: bd };
  });
  const groups = medoids.map((m, i) => {
    const members = scenarios.filter((_, si) => assign[si].index === i);
    const spread = members.length ? members.reduce((s, c) => s + distance(m, c, ids), 0) / members.length : 0;
    return { index: i, medoid: m, members, size: members.length, avgDistance: spread };
  }).filter(g => g.size > 0);
  return { k: groups.length, clusters: groups, method: 'k-medoids / Hamming', limited: scenarios.length < (scenarios.count ?? scenarios.length) };
}

// 有向网络：只画矩阵里真实存在的格子；0 分不画成“无影响”，而是单独计数。
function network(input) {
  const nodes = [];
  for (const id of input.activeDescriptorIds) for (const s of input.matrix.stateIdsByDescriptor[id]) nodes.push({ id: s, descriptorId: id });
  const edges = [], zeros = [];
  for (const e of input.matrix.entries) {
    if (e.sourceStateId === e.targetStateId) continue;
    const edge = { source: e.sourceStateId, target: e.targetStateId, score: e.score, judgmentId: e.judgmentId };
    if (e.score === 0) zeros.push(edge); else edges.push(edge);
  }
  return { nodes, edges, zeroEdges: zeros.length };
}

function degrees(input) {
  const map = new Map(input.activeDescriptorIds.map(id => [id, { out: 0, in: 0, positive: 0, negative: 0 }]));
  for (const e of input.matrix.entries) {
    const a = stateOwner(input, e.sourceStateId), b = stateOwner(input, e.targetStateId);
    if (!a || !b || a === b) continue;
    map.get(a).out++; map.get(b).in++;
    if (e.score > 0) map.get(a).positive++; if (e.score < 0) map.get(a).negative++;
  }
  return map;
}
function stateOwner(input, stateId) {
  for (const id of input.activeDescriptorIds) if ((input.matrix.stateIdsByDescriptor[id] || []).includes(stateId)) return id;
  return null;
}

function stateProfile(input, run, config) {
  const rows = input.activeDescriptorIds.map(descriptorId => {
    const stateId = config[descriptorId];
    const bucket = run?.stateCounts?.[descriptorId] || {};
    const total = run?.count ?? null;
    return { descriptorId, stateId, count: bucket[stateId] ?? 0, freq: total ? (bucket[stateId] ?? 0) / total : null };
  });
  return { rows, total: run?.count ?? null };
}

Object.assign(__exports, { configKey, tisOf, gammaOf, distribution, topStates, diffSets, distance, clusters, network, degrees, stateProfile });
},

        el('div', { class: 'bd' },
          el('label', { class: 'robust-field' }, '方向', pick),
          el('label', { class: 'robust-field' }, '扰动量', delta),
          el('div', { class: 'robust-actions' }, el('button', { class: 'button primary-action', onclick: run }, '重算并比较')),
          message, out)),
      el('p', { class: 'v5-hint' }, '尚未接入：多参数联合扰动、随机轮次与置信度加权（旧平台 v1.5 的实现基于描述符级矩阵，口径不同，未直接搬用）。'));
