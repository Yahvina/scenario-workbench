/* Provisional slate-blue preview. Exact values await user review; see DESIGN.md. */
:root{
  /* 冷灰科研纸（v1.8 起）：画布 95 / 卡片 100 / 井 90，卡片浮在画布之上。
     原来是暖米纸、三阶只差 3.8 个明度点，屏幕上分不出层次。 */
  --bg:#EBEFF2; --panel:#FFFFFF; --panel2:#D9DFE3;
  --line:#C5CBD0; --line2:#DDE2E6;
  --tx:#080E13; --tx2:#242A2F; --tx3:#4E5358;
  --pri:#4B657B; --pri-d:#334B60; --pri-s:#E7EDF3; --pri-b:#B9C9D5;
  --ok:#4B657B; --ok-s:#E7EDF3; --ok-b:#B9C9D5;
  --wn:#6D5940; --wn-s:#F3EEE6; --wn-b:#CFC4B1;
  --rd:#972F27; --rd-s:#F9EBE9; --rd-b:#E9BAB5;
  /* CIB 双极色阶：蓝（抑制）— 纸灰（无）— 赭（促进），两侧同明度，只差色相 */
  --s-3:#405F7E; --s-2:#7890A8; --s-1:#B0BFCD;
  --s0:#E1E5E8;
  --s1:#C9C0D7; --s2:#9887AF; --s3:#69547F;
  --r:3px; --r2:5px;
  --sh:0 1px 2px rgba(8,14,19,.06);
  --sh2:0 2px 6px rgba(8,14,19,.08);
  --sh3:0 10px 30px rgba(8,14,19,.14);
  --ease:cubic-bezier(.2,.7,.3,1);
  --warm:var(--wn);
  /* 深色框架：全站唯一的重色，用在顶栏与结果摘要。没有它，整页只有一堆等重的浅色。 */
  --dark:#26323C; --dark-2:#34424D; --dark-ink:#E6ECF2; --dark-ink2:#93A0AC;
}

hild{border-bottom:0}.workflow p{font-size:12px;color:var(--tx3);margin-top:3px}.workflow span{align-self:start;font-size:12px;color:var(--tx3)}.side-section{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.side-section:last-child{margin:0;padding:0;border:0}.side-section h2{font-size:15px;margin-bottom:12px}.facts{margin:0}.facts div{margin-top:12px}.facts dt{font-size:12px;color:var(--tx3)}.facts dd{margin:2px 0 0;overflow-wrap:anywhere}.trace{padding-left:18px;color:var(--tx2)}.trace li{padding:4px 0}.empty-state{min-height:290px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;justify-content:center;padding:20px}.notice{background:var(--info-bg);color:var(--info-text);padding:12px 16px;border-radius:var(--r);margin-top:20px}.snapshot{overflow-wrap:anywhere;font-size:12px;margin-top:12px}.snapshot summary{cursor:pointer;color:var(--pri);padding:6px 0}.snapshot pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:var(--bg);padding:12px;font-size:12px}.method-table{border-collapse:collapse;width:100%;margin:18px 0}.method-table th,.method-table td{padding:10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}.method-table th{font-weight:600}.formula{font-family:inherit;padding:15px;background:var(--bg);margin:16px 0}.footer{margin-top:22px;color:var(--tx3);font-size:12px}.skip{position:absolute;top:-100px;left:10px;background:var(--panel);padding:8px;z-index:10}.skip:focus{top:10px}.inline-file{max-width:100%}.dirty{color:var(--wn)}@media(min-width:1500px){.workspace{padding:40px 48px}}@media(max-width:1100px){.content-grid{grid-template-columns:minmax(0,1fr)}.context-panel{display:grid;grid-template-columns:1fr 1fr;gap:24px}.side-section{margin:0;border:0;padding:0}.workspace{padding:24px}.layout{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:650px){.topbar{padding:14px 16px;flex-wrap:wrap;gap:12px}.version{margin-left:8px}.layout{display:block}.sidebar{padding:10px 12px .elements-module { min-width:0; }
.elements-module .elements-tools { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
.elements-module .elements-columns { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:24px; align-items:start; }
.elements-module .elements-row { position:relative;display:grid; grid-template-columns:24px minmax(0,1fr) 28px; gap:6px; padding:9px 6px; padding-inline-start:calc(6px + var(--tree-indent,0px));align-items:center;min-height:42px;border-radius:var(--r); }
.elements-module .elements-row:not(.is-root)::before{content:'';position:absolute;left:calc(var(--tree-indent,0px) - 2px);top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none}
.elements-module .elements-row:hover{background:var(--bg)}
.elements-module .elements-row.is-root{margin-top:12px;background:var(--bg);font-weight:600}
.elements-module .elements-row.is-selected{background:var(--selection-bg);color:var(--selection-text)}
.elements-module .elements-level{font-size:12px;color:var(--tx3);text-align:right;font-weight:400}

.elements-module .elements-disclosure:hover{background:var(--panel2);color:var(--tx)}
.elements-module .elements-disclosure:disabled{background:transparent;cursor:default}
.elements-module .elements-leaf{display:block;width:24px;height:24px}
.elements-module .elements-browser{min-width:0}

.elements-module .elements-tree-info{padding-bottom:10px;border-bottom:1px solid var(--line)}
.elements-module .elements-summary{min-width:0;border-left:1px solid var(--line);padding-left:20px;max-height:640px;overflow:auto;scrollbar-color:var(--line) var(--panel)}
.elements-module .elements-intro{margin:6px 0 18px;color:var(--tx3)}
.elements-module .elements-selection-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.elements-module .elements-dataset{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--bg);padding:10px 12px;margin-bottom:18px}
.elements-module .elements-catalog-groups{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin:16px 0 20px}
.elements-module .elements-catalog-groups section{border-top:1px solid var(--line);padding-top:10px}
.elements-module .elements-catalog-groups p{font-size:12px;color:var(--tx3);margin-top:6px;overflow-wrap:anywhere}
.elements-module .elements-catalog:has(.elements-catalog-groups){padding:18px 0 24px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.elements-module .elements-rules{margin-left:auto;font-size:12px;max-width:55ch}
.elements-module input[type=checkbox]{accent-color:var(--action);margin-top:4px}
.elements-module .elements-row label { display:flex; align-items:start; gap:8px; overflow-wrap:anywhere; }
.elements-module .elements-row input { width:auto; flex:none; }
.elements-module .elements-row > .muted { grid-column:2; font-size:12px; }
.elements-module article { padding:12px 0; border-bottom:1px solid var(--line2); overflow-wrap:anywhere; }
.elements-module details { margin:8px 0; }
.elements-module summary { cursor:pointer; }
.elements-module input[type=search] { width:100%; min-height:38px; margin-top:6px; padding:7px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); }
.elements-module h3 { font-size:16px; }
.elements-module strong { font-size:15px; }
.elements-module button:focus-visible, .elements-module input:focus-visible, .elements-module summary:focus-visible { outline:2px solid var(--action); outline-offset:2px; }
@media(max-width:760px) { .elements-module .elements-columns { grid-template-columns:minmax(0,1fr); } .elements-module .elements-summary{border-left:0;border-top:1px solid var(--line);padding:18px 0 0;max-height:none}.elements-module .elements-catalog-groups{grid-template-columns:1fr}.elements-module .elements-tree{max-height:480px} }

.elements-module .definition-editor{border-bottom:1px solid var(--line);padding:12px 0}.definition-editor label{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;overflow-wrap:anywhere}.definition-editor input:not([type=checkbox]),.definition-editor select{width:100%;min-width:0;box-sizing:border-box;padding:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit}.definition-editor fieldset{min-width:0;border:1px solid var(--line);margin:12px 0;padding:12px}.definition-editor button{margin:6px 8px 6px 0}.definition-editor pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}

.elements-module .framework-box>summary{font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;padding:10px 0}

.elements-module .elements-level{white-space:nowrap;font-size:12px;color:var(--tx3);flex:none}
.elements-module .framework-box .zone-bar{margin:0 0 10px}

.elements-module .elements-picked{font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap}

/* P5/P6 导出模块样式：只作用于 .exports-module 之下的报告页与对比表。
   为什么全部带前缀：导出页会挂在公共内容区里，任何无前缀选择器都可能改到别人的界面。
   颜色与圆角一律复用主题变量，不新增色值。 */
.exports-module { min-width:0; }
/* 为什么需要这两条：select 的默认宽度由最长 option 决定，导出页有个选项名很长，
   窄屏下会把这个宽 324px 的面板撑到 2038px（实测 390×844 下整页横向滚动）。
   时间线、关系、求解三个模块各自都写了同样的约束，这里原先漏了。 */
.exports-module select { max-width:100%; min-width:0; }
/* ai-draft-panel.mjs 的 pre.exports-prompt 没有内联换行样式，长提示词会顶出屏幕；
   模型输入面板的 pre 自带内联 white-space，这里统一兜住。 */
.exports-module pre { white-space:pre-wrap; overflow-wrap:anywhere; }
.exports-module h3 { font-size:16px; }
.exports-module p { overflow-wrap:anywhere; }
.exports-module .exports-note { font-size:13px; color:var(--tx3); margin:6px 0; }
.exports-module .exports-source { font-size:12px; color:var(--tx3); margin:2px 0 8px; }

.exports-module .exports-report { display:flex; flex-direction:column; gap:20px; min-width:0; }
.exports-module .exports-report > section { border-top:1px solid var(--line2); padding-top:12px; min-width:0; }
.exports-module .exports-report > section:first-of-type { border-top:0; padding-top:0; }
.exports-module .exports-report h2 { font-size:16px; margin:0 0 6px; }
.exports-module .exports-report ul { margin:6px 0; padding-left:20px; }
.exports-module .exports-report li { margin:2px 0; overflow-wrap:anywhere; }

.exports-module .exports-stale { border-left:3px solid var(--wn); background:var(--wn-s); color:var(--tx); padding:8px 12px; }
.exports-module .exports-gaps { border-left:3px solid var(--tx3); padding:8px 12px; }

.exports-module .exports-table { border-collapse:collapse; width:100%; margin:12px 0; }
.exports-module .exports-table th,
.exports-module .exports-table td { border-bottom:1px solid var(--line2); padding:8px 6px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
.exports-module .exports-table th { color:var(--tx3); font-weight:600; font-size:12px; }

.exports-module .exports-compare { display:flex; flex-direction:column; gap:12px; min-width:0; }
.exports-module .exports-compare-summary { margin:0; padding:8px 12px; background:var(--panel2); border-radius:var(--r); }
.exports-module .exports-compare td.exports-cell-left { width:34%; }
.exports-module .exports-compare td.exports-cell-right { width:34%; }
.exports-module .exports-compare tr[data-exports-same="false"] td { background:var(--pri-s); }
.exports-module .exports-compare tr[data-exports-same="true"] td { color:var(--tx2); }
.exports-module .exports-compare .exports-kind { color:var(--tx3); font-size:12px; white-space:nowrap; }
.exports-module .exports-compare .exports-ids { color:var(--tx3); font-size:12px; }

@media(max-width:760px) {
  .exports-module .exports-table,
  .exports-module .exports-table thead,
  .exports-module .exports-table tbody,
  .exports-module .exports-table tr,
  .exports-module .exports-table td { display:block; }
  .exports-module .exports-table thead { display:none; }
  .exports-module .exports-table td[data-label]::before { content:attr(data-label); display:block; font-size:12px; color:var(--tx3); margin-bottom:4px; }
}

/* 首页：地图与范围表单并排，主动作留在首屏 */

/* 地图卡片：默认紧凑，统计与来源收进“查看政策资料” */

/* Neutral surface candidate; validated in the sample before application-wide use. */
:root{--bg:#F2F3F5;--panel:#FFFFFF;--panel2:#E7E9EC;--line:#BCC2C9;--line2:#E1E4E8;--tx:#30363D;--tx2:#454D56;--tx3:#606973;--pri:#424C58;--pri-d:#303842;--pri-s:#ECEEF1;--pri-b:#A6AEB8;--action:#424C58;--action-hover:#303842;--selection-bg:#ECEEF1;--selection-text:#30363D;--info-bg:#F5F6F7;--info-text:#454D56;--focus:#586675;--warning:#715B31;--warning-bg:#F6F2E9;--wn:var(--warning);--wn-s:var(--warning-bg);--wn-b:#C8BA99;--danger:#9C3438;--rd:var(--danger);--rd-s:#FBF0F0;--rd-b:#D6ABAE;--chart-1:#456D91;--chart-2:#80668E;--chart-3:#925B60;--chart-4:#687381;--s-3:#365E83;--s-2:#7896B0;--s-1:#C9D7E3;--s0:#F0F1F3;--s1:#E0D5E5;--s2:#AC94BA;--s3:#755B83}
body{background:var(--bg);color:var(--tx)}
.topbar{background:var(--panel);color:var(--tx);border-bottom:1px solid var(--line2)}
.version,.view-dropdown label{color:var(--tx3)}
.view-dropdown select{border-color:var(--line);background:var(--panel);color:var(--tx)}
.button,.button.secondary{background:var(--panel);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.button:hover,.button.secondary:hover{background:var(--bg);border-color:var(--pri-b);color:var(--tx)}
.button:active,.button.secondary:active{background:var(--panel2);border-color:var(--focus);transform:translateY(1px)}
.button.text{background:transparent;color:var(--tx2);border-color:transparent}
.button.text:hover{background:var(--bg);border-color:var(--line)}
.button.primary-action{font-weight:600;padding-inline:24px;border-color:var(--line)}
.button.primary-action:hover{border-color:var(--pri-b)}
.button.primary-action:active{border-color:var(--focus)}
button:disabled,button:disabled:hover{color:var(--tx3);background:var(--info-bg);border-color:var(--line2);transform:none}
:focus-visible,.topbar :focus-visible,.elements-module button:focus-visible,.elements-module input:focus-visible,.elements-module summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
input:hover,select:hover{border-color:var(--pri-b)}
input:focus-visible,select:focus-visible{background:var(--panel);border-color:var(--focus)}
input[aria-invalid=true]{border-color:var(--danger);background:var(--rd-s)}
.nav-item[aria-current=page]{position:relative;background:var(--selection-bg);font-weight:600;color:var(--tx)}
.nav-item[aria-current=page]::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--tx2)}
.elements-module .elements-row.is-selected{background:var(--selection-bg);color:var(--selection-text)}
.elements-module .elements-inline{color:var(--tx2);text-decoration:underline;text-underline-offset:3px}
.elements-module input[type=checkbox]{accent-color:var(--focus)}
.elements-module .elements-disclosure:hover{background:var(--panel2)}
.variable-mark{display:inline-block;width:8px;height:8px;margin-right:7px;background:var(--variable-color);border-radius:50%;vertical-align:middle}
.error-text{color:var(--danger);font-size:12px}.warning-text{color:var(--warning);font-size:12px}
.matrix-example{border-collapse:collapse;width:100%;margin-top:12px;font-variant-numeric:tabular-nums}
.matrix-example th,.matrix-example td{border:1px solid var(--line);padding:9px;text-align:center;font-size:12px}
.matrix-example th{background:var(--panel);font-weight:400}
.matrix-negative{background:var(--s-3);color:var(--panel)}.matrix-positive{background:var(--s3);color:var(--panel)}.matrix-zero{background:var(--s0);color:var(--tx)}
.matrix-missing{background:var(--panel);outline:1px dashed var(--tx3);outline-offset:-4px;color:var(--tx3)}
@media(prefers-reduced-motion:reduce){.button:active{transform:none}}

/* P2 compact context, shared by both perspectives. */
.content-grid{grid-template-columns:minmax(0,1fr)!important}.context-panel{grid-row:1;padding:12px!important}.context-panel .facts{display:flex;flex-wrap:wrap;gap:8px 24px}.context-panel .side-section{margin:0}.context-panel h2{font-size:16px}.context-panel details{margin-top:6px}.context-panel details .trace{margin:8px 0}.content-grid>#module-content{min-width:0}.sidebar details summary{padding:12px;cursor:pointer}.solver-module [data-experience-summary]{padding:12px;border:1px solid var(--line);margin:8px 0}.solver-module details{margin:8px 0}.solver-module h3,.solver-module label{overflow-wrap:anywhere}

/* H1 start page: local layout only. Reuses the existing neutral tokens and type scale. */
/* On the start page the compact context panel would push the single primary action
   below a 1280x800 fold, so it moves under the form; scoped to the start form so no
   other page changes. */
.content-grid:has(#home-start-form)>#module-content{grid-row:1}
.content-grid:has(#home-start-form)>.context-panel{grid-row:2}
.home-progress{margin:14px 0 0;padding:10px 12px;background:var(--info-bg);border:1px solid var(--line2);border-radius:var(--r);font-size:12px;color:var(--tx3)}
#module-content>form{margin-top:20px}
.actions.name-actions{margin-top:0}
/* The choice of where and when plus the one primary action have to share the
   1280x800 first screen even after a year chip appears, so the start page trims
   only its own surrounding vertical space. */
.content-grid:has(#home-start-form)>#module-content{padding-top:12px}
.section-head:has(+.home-progress){margin-bottom:8px}
.home-progress{margin:0 0 10px;padding:6px 10px}
.home-choice{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.home-choice small{flex:0 1 auto;color:var(--tx3);font-size:12px}
#module-content>form#home-start-form{margin-top:12px}
#home-catalog-source{margin-top:6px}

.chip:hover{background:var(--bg);border-color:var(--pri-b)}
.chip:active{background:var(--panel2);border-color:var(--focus)}

#home-more .field{margin-top:16px}

#home-library .library-host>section{margin-top:12px}
/* A drafted new scenario has to state what it replaces and how to keep the original
   project before it is submitted, so that notice sits above the form; while it is
   shown the decorative progress strip yields its space and the one primary action
   still fits the 1280x800 first screen. */
#home-new-draft{margin:10px 0 0;padding:10px 12px;font-size:12px}
#home-new-draft p{margin:0 0 6px}
#home-new-draft .actions{margin-top:8px}

/* While a draft is being filled in, the secondary explanations above and inside the
   form are dropped so the replacement notice and the one primary action share the
   first screen; every one of them returns the moment the draft is abandoned. */
.home-pending .section-head p{display:none}
.home-pending #home-start-form .field small{display:none}
@media(max-width:650px){.chips-wrap{margin-top:16px}.chip{min-height:38px}.home-choice{grid-template-columns:1fr}}

/* ═══ v5 定向修改稿落地（ui/v5-relations，2026-11-05）═══
   令牌与布局学自用户认可的《关系页改版样稿 v5》：克制的选中蓝只进方向条、
   步骤条与图册选中态；CIB 色阶回到蓝—纸灰—赭双极；白表面与灰按钮体系不变。 */
:root{--v5:#1B589E;--v5-d:#003B7A;--v5-s:#DBE9FC;--v5-b:#A9C0DE;
  --s-3:#386CA0;--s-2:#608AB5;--s-1:#96AEC7;--s0:#E1E5E8;--s1:#C3A392;--s2:#AE785A;--s3:#965630;}
/* 方向条：正在判断谁 → 谁，一眼可读 */
.rel-pairbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 16px;margin:12px 0}
.rel-pairbar .cap{font-size:12px;color:var(--tx3);flex:none}
.rel-factor{display:flex;flex-direction:column;gap:1px;border:1px solid var(--v5-b);border-left:3px solid var(--v5);border-radius:var(--r2);background:var(--v5-s);padding:4px 12px;min-width:220px;max-width:340px;flex:1 1 220px}
.rel-factor .role{font-size:12px;color:var(--tx3)}
.rel-factor select{border:0;background:transparent;font-size:14px;font-weight:600;color:var(--v5-d);padding:0;min-height:24px;min-width:0;width:100%}
.rel-factor.empty{background:var(--panel);border:1px dashed var(--line);border-left:3px solid var(--line)}
.rel-factor.empty select{color:var(--tx3);font-weight:400}
.rel-arrow{color:var(--v5);font-size:18px;font-weight:700;flex:none}
.rel-swap{font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;background:var(--panel);cursor:pointer}
.rel-swap:hover{color:var(--v5);border-color:var(--v5-b)}
.rel-pstate{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:3px;border:1px solid var(--line);color:var(--tx2);background:var(--panel);flex:none}
.rel-pstate.ok{color:var(--v5);border-color:var(--v5-b);background:var(--v5-s)}
.rel-pstate.warn{color:var(--wn);border-color:var(--wn-b);background:var(--wn-s)}
.rel-nexthint{font-size:12px;color:var(--tx3);margin:0 0 10px}
.rel-records{margin:10px 0;border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px;background:var(--panel)}
.rel-records>summary{font-size:12px;color:var(--tx2);cursor:pointer}
.rel-records label{font-size:12px}
/* 步骤条：任务顺序常驻 */
.rel-steps{display:flex;align-items:center;flex-wrap:wrap;gap:6px 0;padding:9px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);margin:12px 0}
.rel-steps .rs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx3);padding-right:18px;position:relative}
.rel-steps .rs .n{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--panel);flex:none}
.rel-steps .rs+.rs::before{content:"";position:absolute;left:-14px;top:9px;width:11px;height:1px;background:var(--line)}
.rel-steps .rs.done{color:var(--tx2)}
.rel-steps .rs.done .n{background:var(--v5);border-color:var(--v5);color:#fff}
.rel-steps .rs.cur{color:var(--tx);font-weight:600;border-bottom:2px solid var(--v5);padding-bottom:1px}
.rel-steps .rs.cur .n{background:var(--v5);border-color:var(--v5);color:#fff}
/* 图册卡：v5 左区 */
.rel-atlas-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;min-width:0}
.rel-atlas-card .trend-atlas>h3{font-size:16px;margin:0 2px 4px;display:inline}
.trend-badge{font-size:12px;color:var(--tx3);border:1px solid var(--line2);border-radius:3px;padding:1px 8px;margin-left:10px;white-space:nowrap}
.trend-ids{display:block;font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.trend-card{position:relative}
.trend-card[aria-pressed=true]{background:var(--v5-s);border-color:var(--v5-b);box-shadow:inset 0 0 0 1px var(--v5-b)}
.trend-card[aria-pressed=true]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--v5);border-radius:1px}
.trend-card[aria-pressed=true] strong{color:var(--v5-d)}
.rel-atlas-card .trend-atlas>button{margin:10px 0 0}
.atlas-mentors{margin-top:14px}
/* 模式按钮：次一级 */
.relationship-modes .button{padding:4px 12px;font-size:12px}
/* 右栏 */
.relation-score-rail>h3{font-size:16px}
.relation-score-rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2)}
@media(max-width:1050px){.rel-pstate{margin-left:0}.rel-factor{flex:1 1 100%}}
@media(max-width:560px){.rel-pairbar{align-items:stretch}.rel-factor{min-width:0}}
.method-links{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.method-links button{margin:0}

/* ═══ 交互收尾（2026-11-06）：流程进度条、右侧抽屉、树行整行展开、首页两条路径、
   参考覆盖摘要、结果后续动作、保存四态、可搜索因素切换。视觉沿用中性表面方案。 ═══ */
.flow-progress{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.flow-progress-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.flow-progress-text{font-size:13px;color:var(--tx)}
.flow-progress-hint{font-size:12px;color:var(--tx3)}
.flow-progress-hint::before{content:"→ ";color:var(--pri)}
@media(max-width:560px){.flow-progress{flex-direction:column;align-items:stretch}.flow-progress button{width:100%}}
/* 右侧抽屉：长内容不占页面；窄屏全宽 */
.app-drawer-overlay{position:fixed;inset:0;background:rgba(20,28,36,.32);z-index:60}
.app-drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,28,36,.08);z-index:61;display:flex;flex-direction:column}
.app-drawer-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.app-drawer-hd h3{margin:0;font-size:15px}
.app-drawer-body{padding:14px 18px;overflow:auto;flex:1}
.app-drawer-body p{font-size:13px;margin:6px 0;color:var(--tx2)}
@media(max-width:560px){.app-drawer{width:100vw;border-left:0}}
/* 树行：名称区域整体可展开；复选框独立；悬停与焦点反馈 */
.elements-module .elements-cell{display:flex;align-items:center;gap:10px;min-width:0}
.elements-module .elements-name{flex:1 1 auto;min-width:0;text-align:left;border:0;background:transparent;padding:2px 4px;margin-left:-4px;font:inherit;color:inherit;border-radius:3px;cursor:pointer;overflow-wrap:anywhere}
.elements-module .elements-row.is-root>.elements-cell .elements-name{font-weight:600}
.elements-module .elements-name:hover{background:var(--panel2);color:var(--pri)}
.elements-module .elements-name:focus-visible{outline:2px solid var(--pri-b);outline-offset:1px}
.elements-module .elements-name-label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.elements-module .elements-row:focus-within{background:var(--bg)}
/* 首页两条路径 */
.home-paths{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin:0 0 14px}
.home-path{flex:1 1 300px;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r2);background:#fff;cursor:pointer;position:relative}
.home-path:hover{border-color:var(--pri-b);background:#f7fafd}
.home-path:focus-visible{outline:2px solid var(--pri-b);outline-offset:2px}
.home-path strong{font-size:16px;color:var(--tx)}
.home-path .muted{font-size:12px;color:var(--tx3)}
.home-path-badge{position:absolute;top:10px;right:12px;font-size:11px;border:1px solid var(--wn-b);background:var(--wn-s);color:var(--wn);border-radius:3px;padding:1px 8px}
.home-path-or{align-self:center;color:var(--tx3);font-size:12px}
@media(max-width:760px){.home-path-or{display:none}}
/* 参考评分覆盖摘要 */
.rel-ref-coverage{font-size:12px;color:var(--tx2);border:1px solid var(--line2);border-radius:3px;padding:2px 8px;background:var(--panel);align-self:center}
.rel-ref-coverage.none{color:var(--tx3);border-style:dashed}
/* 结果页：解释与比较、保存新方案 */
.solver-scenario-compare{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.solver-scenario-compare h4{margin:0 0 6px;font-size:13px}
.solver-compare-list{margin:6px 0;padding-left:18px;font-size:13px;color:var(--tx2)}
.solver-compare-list li{margin:2px 0}
.solver-compare-list .is-diff{color:var(--tx);font-weight:600}
.solver-scenario-table td:last-child{white-space:nowrap}
.scenario-save-dialog .reference-body{max-height:none}
/* 保存状态四态 */
.save-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:12px 0 16px}
.save-chip{border:1px solid var(--line2);border-radius:var(--r);padding:8px 12px;background:var(--panel)}
.save-chip b{display:block;font-size:13px;margin-bottom:2px}
.save-chip span{font-size:12px;color:var(--tx3)}
.save-chip.ok b{color:var(--pri)}
.save-chip.bad{border-color:var(--wn-b);background:var(--wn-s)}
.save-chip.bad b{color:var(--wn)}
/* 可搜索因素切换 */
.factor-picker-search{display:flex;flex-direction:column;gap:6px;flex:1 1 260px;font-size:13px}
.factor-search{width:100%;min-height:38px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.factor-picker-nav{display:flex;gap:6px;align-items:flex-end}
.region-material-btn,.source-btn{font-size:12px}

/* ═══ v5 平台级落地（2026-11-05）═══
   学自用户认可的《关系页改版样稿 v5》：冷灰画布 + 白功能卡 + 独立右栏；
   克制的选中蓝只用于“当前/选中/主操作”，其余仍是灰按钮；
   CIB 色阶回到蓝—纸灰—赭双极（正=赭，负=蓝，0=纸灰）。 */
:root{
  --pri:#1B589E;--pri-d:#003B7A;--pri-s:#DBE9FC;--pri-b:#A9C0DE;
  --action:var(--pri);--action-hover:var(--pri-d);
  --selection-bg:var(--pri-s);--selection-text:var(--pri-d);
  --s-3:#386CA0;--s-2:#608AB5;--s-1:#96AEC7;--s0:#E1E5E8;--s1:#C3A392;--s2:#AE785A;--s3:#965630;
  --serif:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
}
.button.primary-action{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.button.primary-action:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff}
.button.primary-action:active{background:var(--pri-d)}
.nav-item[aria-current=page]{background:var(--pri-s);color:var(--pri-d)}
.nav-item[aria-current=page]::before{background:var(--pri);width:2px}

/* 页面骨架：标题 + 主区 + 右栏（v5 的 1fr / 384px 比例） */
.v5-head{margin:2px 0 14px}
.v5-head .eyebrow{font-size:12px;color:var(--tx3);letter-spacing:.04em}
.v5-head h1{font:700 21px/1.45 var(--serif);letter-spacing:.02em;margin:2px 0 4px}
.v5-head .lead{font-size:13px;color:var(--tx3);max-width:76ch}
.v5-head .head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.v5-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.v5-main{min-width:0}
.v5-rail{min-width:0;display:flex;flex-direction:column;gap:12px}
.v5-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 1px 2px rgba(8,14,19,.05);min-width:0}
.v5-card+.v5-card{margin-top:12px}
.v5-card>.hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2)}
.v5-card>.hd h2,.v5-card>.hd h3{font-size:16px;font-weight:600;margin:0}
.v5-card>.hd .no{font-size:12px;color:var(--pri);border:1px solid var(--pri-b);border-radius:var(--r);padding:0 7px;flex:none}
.v5-card>.hd .note{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:400}
.v5-card>.bd{padding:12px 14px}
.v5-card>.bd>:first-child{margin-top:0}
.v5-hint{font-size:12px;color:var(--tx3);line-height:1.7}
.v5-hint b{color:var(--tx2);font-weight:600}
.v5-list{list-style:none;margin:0;padding:0}
.v5-list>li{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.v5-list>li:last-child{border-bottom:0}

"src/core/ui.mjs": (__require, __exports) => {
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key.startsWith('on')) node.addEventListener(key.slice(2).toLowerCase(), value);
    else if (value !== false && value !== null && value !== undefined) node.setAttribute(key, String(value));
  }
  for (const child of children.flat(Infinity)) if (child !== null && child !== undefined) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}

// 右侧抽屉：长内容（政策资料、来源、定义）不再塞进页内折叠。
// 打开时只新建覆盖层与面板，不搬动原页面，因此关闭后原滚动位置、对象与草稿都在；
// Esc 或点关闭后焦点返回触发按钮。窄屏由 CSS 变为全宽面板。
// 同时只允许一个抽屉：重开时先走正式关闭链，否则旧 panel 残留、body overflow 状态也会错。
let activeDrawerClose = null;
function openDrawer(trigger, title, buildContent) {
  activeDrawerClose?.();
  const previousOverflow = document.body.style.overflow;
  const back = trigger || document.activeElement;
  const close = () => {
    if (activeDrawerClose !== close) return;
    activeDrawerClose = null;
    overlay.remove(); panel.remove(); document.body.style.overflow = previousOverflow; back?.focus?.();
  };
  const overlay = el('div', { class: 'app-drawer-overlay', 'aria-hidden': 'true' });
  overlay.addEventListener('click', close);
  const heading = el('h3', { id: 'app-drawer-title' }, title);
  const body = el('div', { class: 'app-drawer-body' });
  const panel = el('aside', { class: 'app-drawer', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'app-drawer-title' },
    el('div', { class: 'app-drawer-hd' }, heading, el('button', { type: 'button', class: 'button text', onclick: close }, '关闭')), body);
  panel.addEventListener('keydown', event => { if (event.key === 'Escape') { event.stopPropagation(); close(); } });
  document.body.append(overlay, panel);
  document.body.style.overflow = 'hidden';
  activeDrawerClose = close;
  try { buildContent(body, close); } catch { close(); return; }
  panel.querySelector('button')?.focus();
  return close;
}

// 路由切换时调用：抽屉挂在 body 上，不随页面内容一起销毁，需显式关闭。
function closeActiveDrawer() { activeDrawerClose?.(); }

// 次要说明统一收进标题旁的“i”：悬停、聚焦、点击都能看，键盘可读。
function infoTip(text, label = '说明') {
  const wrap = el('span', { class: 'info-tip' });
  const pop = el('span', { class: 'info-pop', role: 'note', hidden: 'hidden' }, text);
  const btn = el('button', { type: 'button', class: 'info-btn', 'aria-label': label, 'aria-expanded': 'false' }, 'i');
  const open = value => { pop.hidden = !value; btn.setAttribute('aria-expanded', String(value)); };
  btn.addEventListener('mouseenter', () => open(true));
  btn.addEventListener('mouseleave', () => open(false));
  btn.addEventListener('focus', () => open(true));
  btn.addEventListener('blur', () => open(false));
  btn.addEventListener('keydown', event => { if (event.key === 'Escape') open(false); });
  btn.addEventListener('click', event => { event.preventDefault(); open(pop.hidden); });
  wrap.append(btn, pop);
  return wrap;
}

// 流程进度摘要：按真实数据回答“现在有什么、还缺什么”。

const { planAtYear } = __require("src/modules/elements/state-plan.mjs");

function yearStateFacts(project) {

    const plan = planAtYear(project, year);
    return { year, complete: plan.complete, missing: plan.missing.map(id => nameOf(project, id)) };
  });

function progressFacts(project) {
  const factorCount = project.selection.descriptorIds.length;
  const years = yearStateFacts(project);
  const noStates = project.selection.descriptorIds.filter(id => !statesFor(project, id).length).map(id => nameOf(project, id));
  const coverage = factorCount >= 2 ? directionCoverage(project) : { need: 0, covered: 0 };
  return {
    factorCount, years, noStates, coverage,
    region: project.scope.regionId || null,
    yearList: (project.scope.years || []).join(' / '),
    readyForJudgment: factorCount >= 2 && !noStates.length,
    missingYearStates: years.filter(y => !y.complete),
    allYearsComplete: factorCount > 0 && years.length > 0 && years.every(y => y.complete)
  };
}

function progressText(route, project, { runSummary, library } = {}) {
  const facts = progressFacts(project);
  const factorPart = !facts.factorCount ? '尚未选择研究因素'
    : '已选 ' + facts.factorCount + ' 项因素';
  // 零因素时 missing 恒为空，不能输出“2030 还缺的状态”这种不通的句子——直接说状态未开始。
  const yearPart = !facts.factorCount
    ? '；年度状态未开始（先选因素）'
    : facts.years.length
      ? '；' + facts.years.map(y => y.complete
          ? y.year + ' 状态已齐'
          : y.year + ' 还缺' + (y.missing.length ? '「' + y.missing.slice(0, 3).join('、') + (y.missing.length > 3 ? ' 等' : '') + '」' : '') + '的状态').join('；')
      : '';
  if (route === 'workspace') {
    const scope = (facts.region || '地区未设置') + ' · ' + (facts.yearList || '年份未设置');
    return { text: scope + ' · ' + factorPart + yearPart, hint: facts.factorCount ? '' : '下一步：在目录里勾选你关注的因素' };
  }
  if (route === 'elements') {
    const noState = facts.noStates.length ? '；' + facts.noStates.slice(0, 2).join('、') + (facts.noStates.length > 2 ? ' 等' : '') + ' 还没有状态定义' : '';
    return { text: factorPart + yearPart + noState, hint: facts.factorCount >= 2 ? '可以判断关系了' : '判断关系至少需要 2 个因素' };
  }
  if (route === 'timeline') return { text: factorPart + yearPart, hint: '' };
  if (route === 'relationships') {
    if (facts.factorCount < 2) return { text: factorPart, hint: '判断关系至少需要 2 个因素' };
    const cov = '已判 ' + facts.coverage.covered + ' / ' + facts.coverage.need + ' 个方向';
    return { text: factorPart + '；' + cov, hint: facts.coverage.covered >= facts.coverage.need ? '评分方向已齐，去核对并检验' : '还缺方向没有判断' };
  }
  if (route === 'solver') {
    const run = runSummary ? (runSummary.stale ? '上次检验已过期' : '已检验 ' + (runSummary.count ?? '—') + ' 个自洽组合（' + (runSummary.year ?? '—') + '）') : '尚未检验';

  }
  if (route === 'exports') {
    const lib = library || { plans: 0, runs: 0 };
    return { text: '命名方案已保存 ' + lib.plans + ' 份；检验记录已保存 ' + lib.runs + ' 份', hint: '本机自动保存不等于云同步；备份文件只在你点下载时生成' };
  }
  return { text: factorPart + yearPart, hint: '' };
}

Object.assign(__exports, { yearStateFacts, progressFacts, progressText });

const LIBRARY_EVENT = 'scenario-workbench:library-changed';

function savedWorkPanel(container, context) {
  const root = el('section', { 'data-saved-work': '', class: 'library' });
  const message = el('p', { role: 'status', 'aria-live': 'polite', class: 'save-msg' });
  const list = el('div');
  const preview = el('div', { class: 'library-preview' });
  const library = readLibrary();
  let state = library.load();
  let pending = null;
  const button = (name, fn) => el('button', { class: 'button secondary', type: 'button', onclick: fn }, name);

  function attempt(fn) { try { fn(); } catch (error) { message.textContent = '未完成：' + error.message; } }
  function committed(bundle, text) { state = { ok: true, bundle, raw: JSON.stringify(bundle) }; pending = null; preview.replaceChildren(); renderList(); message.textContent = text; }

  // 检验记录的保存动作在首屏 runSavePanel；这里只负责历史列表与导入导出。
  const importFile = el('input', { type: 'file', class: 'save-file', accept: '.json,application/json', 'aria-label': '导入历史库或单条检验记录' });
  importFile.addEventListener('change', async () => {
    pending = null; preview.replaceChildren();
    try {
      const file = importFile.files[0]; if (!file) return;
      if (file.size > MAX_BYTES) throw new Error('文件超过 5MiB');
      state = library.load(); renderList();
      if (!state.ok) throw new Error('原库损坏或不可访问，请先保留原始数据并处理');
      const incoming = parseImport(await file.text(), state.bundle), merged = mergeBundle(state.bundle, incoming);
      pending = { incoming, raw: state.raw };
      preview.append(el('h4', {}, '恢复前预览'),
        el('p', {}, '文件包含方案：' + (incoming.plans.map(p => p.name).join('、') || '无') + '；检验记录：' + (incoming.runs.map(r => r.name).join('、') || '无')),
        el('p', {}, '合并后 ' + merged.plans.length + ' 条方案、' + merged.runs.length + ' 条检验记录。不会替换当前项目，也不会复算历史结果。'),
        button('确认合并历史库', () => attempt(() => {
          if (!pending) throw new Error('请重新选择文件');
          if (!confirm('确认合并预览中的历史库？当前项目不变，历史计数未复算。')) return;
          const current = library.load();
          if (!current.ok || current.raw !== pending.raw) throw new Error('历史库已变化，请重新预览');
          committed(library.merge(pending.incoming), '已合并历史库；其中记录仍是未复算的历史声明。');
        })));
      message.textContent = '文件校验完成，请核对预览后确认；尚未写入。';
    } catch (error) { message.textContent = '未导入：' + error.message; }
  });

  function renderList() {
    list.replaceChildren();
    if (!state.ok) {
      list.append(el('p', { role: 'alert' }, '历史库无法读取或已损坏，原内容未清空：' + state.error));
      if (state.raw !== null) list.append(button('下载损坏库原始数据', () => download('saved-work-damaged.json', state.raw, true)));
      list.append(button('确认后重建空历史库', () => attempt(() => {
        if (confirm('重建会替换损坏的历史库。请先下载原始数据；确认重建空库？')) committed(library.rebuild(), '已按明确确认重建空历史库。');
      })));
      return;
    }
    const plans = state.bundle.plans, runs = state.bundle.runs;
    list.append(el('h4', {}, '我的方案（' + plans.length + '）'));
    if (!plans.length) list.append(el('p', { class: 'v5-hint' }, '还没有保存的方案。回到上方「保存当前方案」即可保存。'));
    for (const plan of plans) {
      const p = plan.project;
      list.append(el('details', { class: 'library-row' }, el('summary', {}, plan.name),
        el('p', {}, (p.scope.regionId || '地区未知') + ' · ' + p.scope.years.join('/') + ' · ' + p.selection.descriptorIds.length + ' 个因素 · 科学修订 ' + p.revision),
        el('p', { class: 'v5-hint' }, '保存于 ' + plan.createdAt),
        el('div', { class: 'library-actions' },
          button('下载方案 ' + plan.name, () => download('named-plan-project.json', p)),
          button('预览恢复方案 ' + plan.name, () => {
            preview.replaceChildren(el('h4', {}, '将恢复：' + plan.name),
              el('p', {}, '完整替换当前项目：' + p.title + '；' + (p.scope.regionId || '未知地区') + '；' + p.scope.years.join('/') + '；' + p.selection.descriptorIds.length + ' 个活动因素。请先下载当前项目备份。'),
              button('确认替换当前项目为此方案', () => attempt(() => {
                if (!confirm('恢复命名方案将替换当前项目及未保存界面内容，请先下载现有备份。继续恢复吗？')) return;
                const result = context.actions.replaceProject(structuredClone(plan.project));
                if (!result.ok) throw new Error(result.error.message);
                context.refresh(); context.notify('方案已恢复；没有自动计算或采用历史结果。');
              })));
          }))));
    }
    list.append(el('h4', {}, '历史检验记录（' + runs.length + '）'));
    if (!runs.length) list.append(el('p', { class: 'v5-hint' }, '还没有保存的检验记录。完成一次检验后，在上方「本次检验结果」里保存。'));
    for (const run of runs) {
      const a = run.archive, r = a.RunResult, input = a.RunInput;
      list.append(el('details', { class: 'library-row' }, el('summary', {}, run.name),
        el('p', {}, '历史记录，未在本次会话复算。声明：' + statusLabel(r?.status || 'blocked') + ' · 成立数 ' + (r?.count === null || !r ? '未定' : r.count) + ' · 年份 ' + (input?.year ?? '无有效输入')),
        el('p', { class: 'v5-hint' }, '保存于 ' + run.createdAt + ' · 地区 ' + (a.projectInputSnapshot.scope.regionId || '未声明')),
        el('div', { class: 'library-actions' }, button('下载检验记录 ' + run.name, () => download('historical-cib-archive.json', a)))));
    }
  }

  root.append(el('h3', {}, '我的方案与历史'), list, preview, message,
    el('details', { class: 'library-io' }, el('summary', {}, '导入、导出与存储说明'),
      el('div', { class: 'library-actions' },
        button('重新读取历史库', () => { state = library.load(); pending = null; preview.replaceChildren(); renderList(); message.textContent = state.ok ? '已重新读取；历史仍未复算。' : '原库无法读取，未清空。'; }),
        button('导出完整历史库', () => attempt(() => { const current = library.load(); if (!current.ok) throw new Error(current.error); download('saved-work-bundle.json', current.bundle); }))),
      el('label', { class: 'save-field' }, '导入历史库或单条检验记录', importFile),
      el('p', { class: 'v5-hint' }, '仅保存在本浏览器；最多 20 条方案 + 20 条检验记录、5MiB；不自动同步、不自动复算。')));
  renderList();
  const reload = () => { state = library.load(); pending = null; preview.replaceChildren(); renderList(); };
  window.addEventListener(LIBRARY_EVENT, reload);
  container.append(root);
  return () => { window.removeEventListener(LIBRARY_EVENT, reload); root.remove(); };
}

  }
  if(r.status==='blocked'){

    el('span',{},zero?'这一年的全部组合都被判为不自洽；你的方案仍保留在下面，可以查看冲突。':'这是该年份全部组合中判为自洽的数量。')));

    el('div',{},el('b',{},String(Math.max(0,r.checked-r.count))),el('span',{},'不自洽组合')),
    el('div',{},el('b',{},r.truncated?'截断':'完整'),el('span',{},r.truncated?'列表截断，计数完整':'全部组合已列出'))));

 /* ── 自洽组合：紧凑表格，点行才展开解释与比较；保存为新方案走预览确认 ── */

  const compareBlock=(config,index)=>{

   }
   const rows=ids.map(id=>{
    const mine=plan.config[id]??null,their=config[id]??null;
    return {id,same:mine===their,mine:mine?stateName(mine):'—',their:their?stateName(their):'—'};
   });
   const diff=rows.filter(x=>!x.same);
   box.append(diff.length

    :el('p',{},'这个组合与你的 '+year+' 年方案完全一致。'),

    ...(diff.length?[el('p',{class:'v5-hint'},'差异只说明状态不同，不代表你的方案错误；你的方案自洽与否看上方「我的方案」结论。')]:[]));

  const saveScenario=(config,index)=>{
   const dialog=el('dialog',{class:'reference-dialog scenario-save-dialog','aria-label':'保存为新方案预览'});
   const rows=ids.map(id=>el('tr',{},el('td',{},name(id)),el('td',{},stateName(config[id]))));

   const doSave=()=>{

     // 副本上落状态：当前项目的年度安排一个字节都不动。
     let clone=structuredClone(p);
     for(const id of ids){try{clone=changeYearState(clone,id,year,config[id],()=>crypto.randomUUID());}catch{/* 与现状相同即跳过 */}}
     library.merge({...emptyBundle(),plans:[namedPlan(clone,value,config)]});
     window.dispatchEvent(new CustomEvent('scenario-workbench:library-changed'));
     msg.textContent='已保存新方案「'+value+'」：它记录这份自洽组合的 '+year+' 年状态；当前项目的年度安排未被改动。';

     el('label',{class:'save-field'},'方案名称',input),
     msg,
     el('div',{class:'reference-actions scenario-save-actions'},
      el('button',{class:'button primary-action',type:'button',onclick:doSave},'确认保存为新方案'),
      el('button',{class:'button text',type:'button',onclick:close},'取消'))));
   document.body.append(dialog);
   dialog.addEventListener('close',()=>dialog.remove());
   dialog.showModal();
  };
  for(let i=0;i<limit;i++){
   const config=r.scenarios[i],trace=r.balanceTrace?.[i]||null;
   const detail=el('tr',{class:'solver-scenario-detail',hidden:'hidden'},el('td',{colspan:String(ids.length+2)},
     trace?el('div',{class:'solver-scenario-trace'},...trace.balances.map(b=>el('p',{},name(b.descriptorId)+'：所选 '+(stateName(b.selectedStateId))+' 支持 '+b.selectedSupport+'，最大 '+b.maximum+'，差距 '+b.gap))):el('p',{},'这条配置的逐项贡献见「查看计算依据」。'),

   const toggle=el('button',{class:'button text','aria-expanded':'false','aria-label':'组合 '+(i+1)+' 解释与比较',onclick:e=>{const open=detail.hidden;detail.hidden=!open;e.currentTarget.setAttribute('aria-expanded',String(open));e.currentTarget.textContent=open?'收起':'解释与比较';}},'解释与比较');

  table.append(tbody);

  // 自洽组合状态画像：与首页地理地图无关；同一份真实结果，两种视图切换，不重复堆两份内容。
  const order=id=>p.data.descriptors.find(d=>d.id===id)?.stateIds||[];
  const view=session.portraitView||(limit<=4?'cards':'matrix');
  const toggleBar=el('div',{class:'portrait-toggle'},
    el('button',{class:'button text'+(view==='cards'?' is-current':''),onclick:()=>{session.portraitView='cards';render();}},'方案卡'),
    el('button',{class:'button text'+(view==='matrix'?' is-current':''),onclick:()=>{session.portraitView='matrix';render();}},'矩阵'),
    el('span',{class:'note'},'前 '+limit+' 个自洽组合'+(r.truncated?'（完整计数 '+r.count+'，列表截断）':'')));
  const portrait=el('div',{class:'solver-portrait'},
   el('div',{class:'hd'},el('h4',{},'自洽组合状态画像'),toggleBar),
   el('p',{class:'v5-hint'},'来自这次冻结结果。颜色只表示状态在因素里的第几档，不是概率、绩效或促进抑制评分。点方案卡或表格行可展开逐因素解释。'));
  if(view==='cards'){
   // 少量组合：每个组合一张卡，状态名直接可读；点卡切到表格并展开那一行的解释。
   const cards=el('div',{class:'portrait-cards'});
   for(let i=0;i<limit;i++){
    const config=r.scenarios[i];
    const card=el('button',{class:'portrait-card',type:'button','aria-label':'组合 '+(i+1)+'，展开解释'},
      el('b',{},'组合 '+(i+1)),
      ...ids.map(id=>{
        const st=p.data.states.find(x=>x.id===config[id]);
        return el('span',{},el('em',{},name(id)),stateName(config[id]));
      }));
    card.addEventListener('click',()=>{session.portraitExpand=i;session.portraitView='matrix';render();

   portrait.append(cards);

   // 组合较多：矩阵；格子里直接写状态名（不是只写 1/2/3），列名完整可换行。
   const expand=session.portraitExpand;
   const head=el('tr',{},el('th',{},'组合'),...ids.map(id=>el('th',{},name(id))));
   const rows=[];
   for(let i=0;i<limit;i++){
    const config=r.scenarios[i];
    const row=el('tr',{class:expand===i?'is-open':'',tabindex:'0','aria-label':'组合 '+(i+1)+'，展开解释'},el('th',{},String(i+1)),...ids.map(id=>{
      const idx=order(id).indexOf(config[id]);
      const label=stateName(config[id]);
      return el('td',{class:'lv'+(idx+1),title:name(id)+'：'+label,'aria-label':name(id)+'：'+label},label);
    }));
    row.addEventListener('click',()=>{const btn=body.querySelectorAll('.solver-scenario-table .solver-scenario-detail')[i]?.previousElementSibling?.querySelector('button')||body.querySelectorAll('.solver-scenario-table tbody > tr')[i*2]?.querySelector('td:last-child button');btn?.click();});
    row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.click();}});
    rows.push(row);
   }
   portrait.append(el('div',{class:'portrait-scroll'},el('table',{class:'portrait-table','aria-label':'自洽组合状态画像'},el('thead',{},head),el('tbody',{},...rows))));

  session.portraitExpand=undefined;

  if(r.scenarios.length>limit)section.append(button('显示更多（还有 '+(r.scenarios.length-limit)+' 个）',()=>{session.scenarioLimit=(session.scenarioLimit||12)+24;render();}));
  return section;

 function render(){if(disposed)return;
  const p=context.store.read();root.replaceChildren();
  const year=el('select',{'aria-label':'检算年份',disabled:!!job,onchange:e=>{session.year=e.target.value;render();}},el('option',{value:''},'请先选年份'),...p.scope.years.map(y=>el('option',{value:y},y)));year.value=session.year;
  const yearRow=el('div',{class:'solver-yearbar'},el('span',{class:'cap'},'检验年份'),year,el('span',{class:'hint'},'换年份只换当前截面，不改项目范围'));
  root.append(el('div',{class:'solver-head'},el('p',{},'先看这一年有哪些自洽情景，再看你自己的方案落在哪里。')),yearRow);

  const last=session.archives.at(-1);
  root.append(summaryCard(p,last));
  root.append(handoffSection(p));

  // 1 · 检验我的方案（读取因素页该年状态；缺状态就地补选）
  const pre=prepareRun(p,{year:session.year===''?null:Number(session.year),selectedJudgmentIds:session.selected,assumptionAcknowledgements:{currentAssumptions:session.assumptions,unknownStateScope:session.unknown}});
  const planEl=planCheckSection({project:p,prepared:pre,session,context,lastArchive:last,onRender:render});
  planEl.classList.add('solver-task');
  planEl.insertBefore(el('div',{class:'solver-task-hd'},el('span',{class:'no'},'2'),el('h3',{},'检验我的方案'),el('span',{class:'note'},'只算这一年你选的状态，不改变枚举范围')),planEl.firstChild);

  // 2 · 寻找所有自洽组合
  const fullSpace=el('section',{class:'solver-fullspace solver-task'},
    el('div',{class:'solver-task-hd'},el('span',{class:'no'},'1'),el('h3',{},'找出所有自洽情景'),el('span',{class:'note'},'枚举这一年允许的全部组合，不锁定我的方案')));
  const fatal=pre.diagnostics.filter(d=>d.classification==='block');
  const spaceText=el('p',{'data-solver-space':''},'组合空间：'+(pre.space?pre.space.constrained+' 种（无约束 '+pre.space.unconstrained+'），上限 '+pre.space.limit:'尚不能确定'));
  fullSpace.append(spaceText);
  if(fatal.length){
   // 同一件事只留一句：缺因素、缺评分、缺状态各合并成一条可操作问题。
   // 底层校验原文一行不删，完整清单仍在下方「查看输入诊断与假设」。
   let needFactors=false,needScores=false,needStates=false,otherMsgs=[];
   for(const d of fatal){
    const m=d.message||'';
    if(/至少需要两个活动变量|至少两个不重复的非空活动变量ID/.test(m)){needFactors=true;continue;}
    if(/没有可用判断|还没有评分|没填评分|缺分|还没给分|矩阵不完整|矩阵缺失|无法准备当前矩阵/.test(m)
      ||d.code==='MISSING_SCORES'||d.code==='NO_APPLICABLE_JUDGMENT'||d.code==='MATRIX_REQUIRED'
      ||/格子/.test(m)){needScores=true;continue;}
    if(/状态|STATES|变量|描述符/.test(m)){needStates=true;continue;}
    otherMsgs.push(m);
   }
   const problems=[];
   if(needFactors)problems.push('还没有选够研究因素（至少 2 个）');
   if(needScores)problems.push('还有格子没给分（空白＝未判断，不等于 0）');
   if(needStates)problems.push('还有因素没选这一年的状态');
   for(const m of otherMsgs.slice(0,3))problems.push(m);
   fullSpace.append(el('p',{class:'solver-cannot'},'还不能检验：'+(problems.length?problems.join('；'):'输入未通过前置检查')),
    el('div',{class:'solver-cannot-actions'},
      needFactors?button('去选择因素',()=>context.navigate('elements')):null,
      needScores?button('去填评分',()=>context.navigate('relationships')):null,
      needStates?button('去选年度状态',()=>context.navigate('elements')):null));
   fullSpace.append(el('div',{class:'solver-cannot-actions'},
      button('查看输入诊断',()=>{const d=fullSpace.querySelector('.solver-diagnostics');if(d)d.open=true;d?.scrollIntoView({block:'center'});})));
  }
  const hasResult=last?.RunResult?.status==='completed';
  const start=button(fatal.length?'开始检验（仍需处理输入）':hasResult?'重新检验':'开始检验',()=>startRun(p,pre));start.disabled=!!job;
  start.classList.add(hasResult?'secondary':'primary-action');
  const diagDetails=el('details',{class:'solver-diagnostics'},el('summary',{},'查看输入诊断与假设（'+pre.diagnostics.length+'）'),el('ul',{},...diagnosticGroups(pre.diagnostics).map(g=>el('li',{},g.count+'项：'+g.message,el('details',{},el('summary',{},'涉及记录与完整诊断'),el('pre',{},JSON.stringify(g.items,null,2)))))));
  if(job)fullSpace.append(button('取消检算',()=>{job.cancel();}),
    el('p',{'data-solver-progress':''},'已检查 '+(progress?.result.checked||0)+(pre.space?' / '+pre.space.constrained:'')+' 种组合，正在计算……未完成前不给自洽总数。'));
  fullSpace.append(start,diagDetails);
  // 顺序：自洽情景在前，我的方案在后；最后才是重新检验与计算详情。
  const scenarios=last?scenariosCard(p,last):null;
  if(last){
    root.append(fullSpace);
    if(scenarios)root.append(scenarios);
    root.append(planEl);
  }else{
    root.append(fullSpace,planEl);
  }

  // 折叠：完整输入、逐项贡献与公式
  if(last)root.append(basisDetails(p,last));

  // 本次检验结果 vs 历史检验记录
  root.append(sessionResultCard(p,last));

  // 高级：年份与逐方向评分选用
  const settings=el('details',{class:'solver-settings','data-solver-settings':'',open:session.settingsOpen??false,ontoggle:e=>{if(e.target.isConnected)session.settingsOpen=e.target.open;}},el('summary',{},'高级：逐方向选用评分'));
  const controls=el('div',{class:'solver-records'},el('h4',{},'各方向使用哪条评分（已选 '+session.selected.length+' 条）'));
  for(const a of p.selection.descriptorIds)for(const b of p.selection.descriptorIds){if(a===b)continue;
   const records=p.data.judgments.filter(j=>j.sourceDescriptorId===a&&j.targetDescriptorId===b);
   const select=el('select',{'aria-label':'检算选用 '+a+' → '+b,disabled:!!job,onchange:e=>{session.selected=session.selected.filter(id=>!records.some(r=>r.id===id));if(e.target.value)session.selected.push(e.target.value);render();}},el('option',{value:''},'未选用'),...records.map(j=>el('option',{value:j.id},'判断 '+(records.indexOf(j)+1)+' · v'+j.version+' · '+(j.scope?.regionId||'地区未知')+' · '+(j.validYears||[]).join('/'))));
   select.value=records.find(r=>session.selected.includes(r.id))?.id||'';
   controls.append(el('label',{},name(a)+' → '+name(b),select));}
  const yearNum=session.year===''?null:Number(session.year),uniq=[];
  if(yearNum!==null)for(const a of p.selection.descriptorIds)for(const b of p.selection.descriptorIds){if(a===b)continue;const list=p.data.judgments.filter(j=>j.sourceDescriptorId===a&&j.targetDescriptorId===b&&j.scope?.regionId===p.scope.regionId&&Array.isArray(j.validYears)&&j.validYears.includes(yearNum));if(list.length===1&&!session.selected.includes(list[0].id))uniq.push(list[0].id);}
  if(uniq.length)controls.append(el('div',{class:'solver-fill-unique'},button('使用这些方向唯一的评分（'+uniq.length+'）',()=>{session.selected=[...new Set([...session.selected,...uniq])];render();})));
  const clear=button('清空本页选用',()=>{session.selected=[];render();});clear.disabled=!!job;
  settings.append(el('p',{class:'v5-hint'},'这里的选用只影响本次计算；关系页的矩阵仍以那边明确采用的记录为准。'),
   controls,
   el('div',{class:'solver-settings-actions'},clear,button('核对项目范围',()=>context.navigate('workspace')),button('核对因素与状态',()=>context.navigate('elements')),button('核对关系与矩阵',()=>context.navigate('relationships'))));
  root.append(settings);
  summaryChanged();
 }

 function handoffSection(p){
  const candidate=readMatrixHandoff(p.id);
  const section=el('section',{'data-flow-candidate':'',class:'solver-handoff'});
  if(!candidate){section.hidden=true;return section;}
  const checked=verifyMatrixHandoff(p,candidate);
  const sameYear=String(candidate.year)===String(session.year);
  const ids=candidate.selectionOfJudgments.map(j=>j.id).sort().join(',');

"src/modules/solver/plan-check-store.mjs": (__require, __exports) => {
// 方案检验记录：把「检验我的方案」的结果落到 localStorage，刷新不丢，白箱链可读。
// 记事实（何时、哪年、哪份配置、什么结论、当时项目修订号）与当次支持的逐条贡献；
// 不复制整张矩阵，只看不写回。过期判定是纯函数，便于单测。
// 写入失败（隐私模式等）静默降级为会话内结果。
const KEY = 'scenario-workbench.plan-check.v1';

// 只留公式卡和反查要用的字段：每个因素所选状态的支持分、各候选支持、逐条贡献。
function compactTrace(trace) {
  return {
    consistent: !!trace.consistent,
    balances: trace.balances.map(b => {
      const candidates = b.candidates || [];
      const selected = candidates.find(c => c.stateId === b.selectedStateId);
      return {
        descriptorId: b.descriptorId,
        selectedStateId: b.selectedStateId,
        selectedSupport: b.selectedSupport,
        maximum: b.maximum,
        gap: b.gap,
        candidates: candidates.map(c => ({ stateId: c.stateId, support: c.support })),
        contributions: (selected?.contributions || []).map(x => ({ sourceDescriptorId: x.sourceDescriptorId, sourceStateId: x.sourceStateId, score: x.score, judgmentId: x.judgmentId }))
      };
    })
  };
}

function planCheckRecord({ project, year, plan, trace }) {
  return {
    year,
    config: { ...plan.config },
    planVersion: plan.planVersion,
    at: new Date().toISOString(),
    projectRevision: project.revision,
    consistent: !!trace.consistent,
    conflicts: trace.balances.filter(b => !b.consistent).length,
    factors: trace.balances.length,
    trace: compactTrace(trace)
  };
}

// 过期原因：配置变过 / 项目修订号变过。返回原因数组；空数组＝仍代表当前输入。
function planCheckStaleReasons(record, { project, plan }) {
  if (!record) return ['还没有检验记录'];
  const reasons = [];
  if (JSON.stringify(record.config) !== JSON.stringify(plan.config)) reasons.push('这一年的状态选择变过');
  if (record.projectRevision !== project.revision) reasons.push('项目输入修订号已从 r' + record.projectRevision + ' 变到 r' + project.revision);
  return reasons;
}

function readPlanChecks(projectId) {
  try {
    const all = JSON.parse(localStorage.getItem(KEY) || '{}');
    const mine = all[projectId];
    return mine && typeof mine === 'object' ? structuredClone(mine) : {};
  } catch { return {}; }
}

function savePlanCheck(projectId, record) {
  try {
    const all = JSON.parse(localStorage.getItem(KEY) || '{}');
    all[projectId] = { ...(all[projectId] || {}), [record.year]: record };
    localStorage.setItem(KEY, JSON.stringify(all));
    return true;
  } catch { return false; }
}

Object.assign(__exports, { planCheckRecord, planCheckStaleReasons, readPlanChecks, savePlanCheck });
},

  '天津市': ['和平区', '河东区', '河西区', '南开区', '河北区', '红桥区', '东丽区', '西青区', '津南区', '北辰区', '武清区', '宝坻区', '滨海新区', '宁河区', '静海区', '蓟州区'],
  '河北省': ['石家庄市', '唐山市', '秦皇岛市', '邯郸市', '邢台市', '保定市', '张家口市', '承德市', '沧州市', '廊坊市', '衡水市']
};

const REGION_SCALES = [
  { id: 'region', label: '区域', hint: '有明确口径的跨省区域' },
  { id: 'province', label: '省 / 直辖市', hint: '省级行政区' },

const { YEAR_MIN, YEAR_MAX } = __require("src/modules/workspace/regions.mjs");
const DEFAULT_TITLE = '未命名情景项目';
const DEFAULT_NAME = '情景1';

// Suggest a readable name from the chosen range without ever overwriting a manual
// name: the suggestion is only written when the user asks for it.
function suggestTitle(regionId, years) {
  const area = (regionId || '').trim();
  const first = [...(years || [])].sort((a, b) => a - b)[0];
  if (area && first) return area + '·' + first + '年情景';
  if (area) return area + '情景';
  if (first) return first + '年情景';
  return DEFAULT_NAME;
}

function displayTitle(projectTitle) {
  return projectTitle === DEFAULT_TITLE ? DEFAULT_NAME : projectTitle;
}

function addYears(list, values) {
  const merged = new Set(list);
  for (const value of values) merged.add(Number(value));
  return [...merged].filter(value => Number.isInteger(value) && value >= YEAR_MIN && value <= YEAR_MAX).sort((a, b) => a - b);
}

function removeYear(list, value) {
  return list.filter(item => item !== Number(value));
}

// One shared parser for every year entry point: the selection chips and the expert
// shortcut field must accept exactly the same values and report the same reasons.
function parseYearList(raw) {
  const text = String(raw === null || raw === undefined ? '' : raw).trim();
  const tokens = text ? text.split(/[,，、\s]+/) : [];
  if (tokens.some(token => !/^\d{4}$/.test(token))) return { ok: false, message: '年份请填写四位整数，并用逗号分隔。' };
  const years = tokens.map(Number);
  if (years.some(year => year < YEAR_MIN || year > YEAR_MAX)) return { ok: false, message: '研究年份需在 ' + YEAR_MIN + '—' + YEAR_MAX + ' 之间。' };
  if (new Set(years).size !== years.length) return { ok: false, message: '年份不重复：请去掉重复的年份。' };
  return { ok: true, years: years.sort((a, b) => a - b) };
}

function checkYear(value) {
  const text = String(value === null || value === undefined ? '' : value).trim();
  if (!/^\d{4}$/.test(text)) return { ok: false, message: '年份请填写四位整数。' };
  const year = Number(text);
  if (year < YEAR_MIN || year > YEAR_MAX) return { ok: false, message: '研究年份需在 ' + YEAR_MIN + '—' + YEAR_MAX + ' 之间。' };
  return { ok: true, year };
}

// A blank range is allowed for exploration, but the missing part stays visible.
function rangeGaps(regionId, years) {
  const gaps = [];
  if (!regionId) gaps.push('尚未选择研究地区');
  if (!years.length) gaps.push('尚未选择研究年份');
  return gaps;
}

function rangeSummary(regionId, years) {
  const area = regionId || '尚未选择地区';
  const when = years.length ? [...years].sort((a, b) => a - b).join(' / ') : '尚未选择年份';
  return area + ' · ' + when;
}

function rangePreview(start, end, step) {
  const from = checkYear(start), to = checkYear(end), gap = Number(step);
  if (!from.ok) return { ok: false, message: '起始年：' + from.message };
  if (!to.ok) return { ok: false, message: '结束年：' + to.message };
  if (!Number.isInteger(gap) || gap < 1) return { ok: false, message: '间隔请填写不小于 1 的整数年。' };
  if (to.year < from.year) return { ok: false, message: '结束年不能早于起始年。' };
  const years = [];
  for (let year = from.year; year <= to.year; year += gap) years.push(year);
  if (years.length > 40) return { ok: false, message: '一次最多预览并添加 40 个年份，请缩小范围或加大间隔。' };
  return { ok: true, years };
}

Object.assign(__exports, { DEFAULT_TITLE, DEFAULT_NAME, suggestTitle, displayTitle, addYears, removeYear, parseYearList, checkYear, rangeGaps, rangeSummary, rangePreview });
},

function regionForScope(scopeValue) {
  return MAP_BY_SCOPE.get(scopeValue) || null;
}

const DEEPER_LEVELS = [
  { id: 'city', label: '市 / 区县', status: '未开放', reason: '缺少离线真实边界与逐区县政策数据；开放会变成虚构地图。' },
  { id: 'park', label: '园区', status: '未开放', reason: '园区不是行政区，且离线包没有任何园区边界或清单；自定义园区名称请到「园区或自定义」填写。' }

// 条款归属只认编号前缀，认不出的记为“未归属”，不猜。
function clauseRegion(clause) {
  const id = String(clause?.clauseId || '');
  if (/^BJ/i.test(id)) return '北京市';
  if (/^TJ/i.test(id)) return '天津市';
  if (/^(HEB|HE)/i.test(id)) return '河北省';
  return null;
}

function regionMatches(clause, scopeValue) {
  const owner = clauseRegion(clause);
  if (!owner) return false;
  if (scopeValue === '京津冀') return true;
  return owner === scopeValue;
}

function projectClauses(project, scopeValue) {
  return (project.data.policies || []).filter(clause => regionMatches(clause, scopeValue));
}

// 离线样例库只含 3 条天津交流稿摘要；单独计数，不混进项目自己的条款。
function libraryClauses(project, scopeValue) {
  const inProject = new Set((project.data.policies || []).map(item => item.clauseId));
  return POLICY_PILOT_CLAUSES
    .filter(clause => !inProject.has(clause.clauseId))
    .filter(clause => regionMatches(clause, scopeValue))
    .map(clause => ({ ...clause, source: POLICY_PILOT_SOURCE.locator }));
}

function regionCoverage(project, scopeValue) {
  const own = projectClauses(project, scopeValue);
  const lib = libraryCoverage(scopeValue);
  const linked = new Set([...own.flatMap(clause => clause.descriptorIds || []), ...lib.descriptors]);
  const relevant = project.data.descriptors.filter(d => scopeValue === '京津冀' || d.id.startsWith('d46-'));
  const covered = relevant.filter(d => linked.has(d.id));
  return {
    own: own.length,
    library: lib.total,
    national: lib.national,
    docCount: lib.docCount,
    matched: lib.matched,
    pending: lib.pending,
    direct: lib.direct,
    partial: lib.partial,
    yearsUnknown: lib.yearsUnknown,
    parks: lib.parks,
    imported: lib.imported,
    covered: covered.length,
    total: relevant.length,
    hasMaterial: own.length + lib.total > 0
  };
}

function coverageLabel(coverage) {
  if (!coverage.imported) return '未导入政策资料';
  if (coverage.library === 0) return '本地区 0 条（已导入库中没有该地区记录）';
  return coverage.own ? '有当地已录入条款' : '已导入政策库（逐条待核）';
}

// 应用地区前的影响说明：不删除、不覆盖、不迁移，只说哪些记录会因此不再适用。
function regionImpact(project, nextScopeValue, { hasResults = false } = {}) {
  const current = project.scope.regionId || null;
  if (current === nextScopeValue) return { changed: false, lines: [] };
  const judgments = (project.data.judgments || []).filter(j => (j.scope?.regionId || null) !== nextScopeValue);
  const plans = (project.data.paths || []).filter(p => p.provenance?.locator === 'state-plan' && (p.scope?.regionId || null) !== nextScopeValue);
  const lines = [];
  if (current) lines.push('研究范围由「' + current + '」改为「' + nextScopeValue + '」。');
  else lines.push('研究范围设为「' + nextScopeValue + '」。');
  const totalJ = (project.data.judgments || []).length, totalP = (project.data.paths || []).length;
  lines.push('现有 ' + totalJ + ' 条关系评分、' + totalP + ' 条年度安排不会被删除；其中适用地区不匹配的 ' + judgments.length + ' 条评分与 ' + plans.length + ' 条安排不会参与新地区的检验，需回关系页与因素页逐条核对。');
  if (hasResults) lines.push('已完成的检验结果会标记为过期，历史不被改写。');
  return { changed: true, lines, judgments: judgments.length, plans: plans.length };
}

},
"src/modules/elements/policy-pilot.mjs": (__require, __exports) => {

const { validateProject } = __require("src/core/contracts.mjs");
// E1 目录小样：只供浏览与「向当前项目加入」使用的独立样例数据。
// 三条摘要来自《描述符分级与时间轴 团队交流版》第 3 节摘录，属团队交流稿条目摘要，

const POLICY_PILOT_SOURCE = {
  ...base,
  id: 'pilot-source-team-draft',
  kind: 'user-assumption',
  sourceId: 'descriptor-taxonomy-team-draft',
  locator: '《描述符分级与时间轴 团队交流版》第 3 节：能源生产与供应 → 燃煤发电与供热 → 数量与比例约束 → 燃煤设施限制与退出强度',

};

const POLICY_PILOT_LEAF_ID = 'pilot-node-coal-restriction';
const POLICY_PILOT_DESCRIPTOR_ID = 'pilot-descriptor-coal-restriction';

// 三条摘要逐字沿用任务单；2027 年与 130 万千瓦只存在于摘要文本里，不进入状态、单位或路径。
const POLICY_PILOT_CLAUSES = [
  {clauseId: 'TJ-P3-010', excerpt: '禁止新建燃煤自备机组', note: '禁建措施与适用对象可展示；覆盖比例待核。'},
  {clauseId: 'TJ-P3-011', excerpt: '禁止新建燃煤锅炉', note: '另一类适用对象，指向同一候选因素。'},
  {clauseId: 'TJ-P33-007', excerpt: '2027 年煤电机组关停替代 130 万千瓦', note: '年份照原文保留；130 万千瓦的关停替代容量的统计口径待核，累计淘汰率需另有分母和基准年。'}
];

const POLICY_PILOT_GAPS = [
  '状态定义：候选因素尚未定义任何状态，不能参与计算。',
  '参数与单位：累计淘汰率缺分母与基准年；130 万千瓦的关停替代容量的统计口径待核。',
  '原件：三条均为团队交流稿摘要，条款原文、发布机构、文号与精确适用范围待核。'
];

function policyPilotTemplate() {
  const ids = ['pilot-node-domain', 'pilot-node-sector', 'pilot-node-measure', POLICY_PILOT_LEAF_ID];
  const node = (id, label, parentIds, childIds, descriptorIds = []) => ({
    ...base, id, label, kind: 'category', parentIds, childIds, descriptorIds,
    evidenceRefs: descriptorIds.length ? [POLICY_PILOT_SOURCE.id] : []
  });
  return {
    taxonomy: [
      node(ids[0], POLICY_PILOT_PATH[0], [], [ids[1]]),
      node(ids[1], POLICY_PILOT_PATH[1], [ids[0]], [ids[2]]),
      node(ids[2], POLICY_PILOT_PATH[2], [ids[1]], [ids[3]]),
      node(ids[3], POLICY_PILOT_PATH[3], [ids[2]], [], [POLICY_PILOT_DESCRIPTOR_ID])
    ],
    descriptors: [{
      ...base, id: POLICY_PILOT_DESCRIPTOR_ID, label: POLICY_PILOT_PATH[3], role: 'context', stateIds: [],
      evidenceRefs: [POLICY_PILOT_SOURCE.id]

// 一条摘要记录的完整形状：编号、内容、说明、**关联因素**与依据都属于同一条记录。
// 三条摘要严格绑定燃煤候选因素：descriptorIds 只含 POLICY_PILOT_DESCRIPTOR_ID。
const clauseRecord = clause => ({
  ...base, id: 'pilot-policy-' + clause.clauseId, clauseId: clause.clauseId, excerpt: clause.excerpt, note: clause.note,
  descriptorIds: [POLICY_PILOT_DESCRIPTOR_ID], reviewStatus: 'draft', evidenceRefs: [POLICY_PILOT_SOURCE.id]
});

// 同一编号、同一内容、同一说明、同一关联因素、同一依据才算同一条记录。
// 比较 provenance.sourceId（记录顶层没有 sourceId，早先版本这里比的是两个 undefined）。
const clauseMatches = (existing, clause) => {
  const expected = clauseRecord(clause);
  return existing.excerpt === expected.excerpt
    && existing.note === expected.note
    && existing.provenance?.sourceId === expected.provenance.sourceId
    && existing.reviewStatus === expected.reviewStatus
    && JSON.stringify(existing.descriptorIds || []) === JSON.stringify(expected.descriptorIds)
    && JSON.stringify(existing.evidenceRefs || []) === JSON.stringify(expected.evidenceRefs);
};

const clauseRecords = project => project.data.policies.filter(item => POLICY_PILOT_CLAUSES.some(clause => clause.clauseId === item.clauseId));

// 加入当前项目：与「向当前项目加入京津冀框架」同一套原子语义 —— 先校验、再克隆、
// 逐 ID 比对，冲突就整体拒绝并说明原因，成功则一次 replaceProject 写入。
// 项目 ID、名称、地区、年份、既有定义/评分/选择一概不动；相同内容重复加入为无变化。
function joinPolicyPilot(project) {
  validateProject(project);
  const template = policyPilotTemplate();
  const carried = clauseRecords(project);
  const next = structuredClone(project), conflicts = [];
  for (const collection of ['taxonomy', 'descriptors', 'evidence']) {
    const incoming = collection === 'evidence' ? [POLICY_PILOT_SOURCE] : template[collection];
    for (const record of incoming) {
      const existing = next.data[collection].find(item => item.id === record.id);
      if (existing && JSON.stringify(existing) !== JSON.stringify(record)) {
        conflicts.push(collection + ' / ' + record.id + '：已有记录与目录小样不同');
      }
    }
  }
  // 先逐条核对编号、内容及关联，再决定报告「已加入」还是「冲突」；
  // 只看条数就当作已加入，会把一条被改写的摘要当成"内容一致"。
  for (const clause of POLICY_PILOT_CLAUSES) {
    const matches = carried.filter(item => item.clauseId === clause.clauseId);
    if (matches.length > 1) conflicts.push('policies / ' + clause.clauseId + '：同一编号存在多条记录');
    else if (matches.length === 1 && !clauseMatches(matches[0], clause)) {
      conflicts.push('policies / ' + clause.clauseId + '：同一编号的摘要、说明、关联因素或依据与目录小样不同');
    }
  }

  if (!next.data.evidence.some(item => item.id === POLICY_PILOT_SOURCE.id)) next.data.evidence.push(structuredClone(POLICY_PILOT_SOURCE));
  let added = 0;
  for (const clause of POLICY_PILOT_CLAUSES) {
    if (carried.some(item => item.clauseId === clause.clauseId)) continue;
    next.data.policies.push(clauseRecord(clause));
    added += 1;
  }
  if (!leafExists) {
    next.data.taxonomy.push(...structuredClone(template.taxonomy));
    next.data.descriptors.push(...structuredClone(template.descriptors));
  }
  validateProject(next);
  return {project: next, added: true, clauses: added};
}

function catalogPilotProject() {
  const project = createProjectStore('policy-catalog-pilot').read();
  project.title = '燃煤设施限制与退出强度 · 目录小样';
  return joinPolicyPilot(project).project;

// 同一页上其他已归类因素（哪怕与同一份交流稿有关）在这里一律返回空数组。
function clausesFor(project, descriptorId) {
  if (descriptorId !== POLICY_PILOT_DESCRIPTOR_ID) return [];
  const node = project.data.taxonomy.find(item => item.descriptorIds.includes(descriptorId));
  if (!node || node.id !== POLICY_PILOT_LEAF_ID) return [];
  const order = new Map(POLICY_PILOT_CLAUSES.map((clause, index) => [clause.clauseId, index]));
  return clauseRecords(project)
    .filter(item => Array.isArray(item.descriptorIds) && item.descriptorIds.includes(POLICY_PILOT_DESCRIPTOR_ID))
    .filter(item => item.evidenceRefs.includes(POLICY_PILOT_SOURCE.id))
    .sort((a, b) => (order.get(a.clauseId) ?? 99) - (order.get(b.clauseId) ?? 99));

Object.assign(__exports, { POLICY_PILOT_SOURCE, POLICY_PILOT_PATH, POLICY_PILOT_LEAF_ID, POLICY_PILOT_DESCRIPTOR_ID, POLICY_PILOT_CLAUSES, POLICY_PILOT_GAPS, policyPilotTemplate, joinPolicyPilot, catalogPilotProject, clausesFor });
},
"src/modules/map/library.mjs": (__require, __exports) => {
// 政策库：把同学的数据集接进地图与 46 项目录。
// 规则：只用数据表里已有的字段；N/A 保持 null（未知），不补 0、不向前填充年份；
// 描述符关联只走 PATH_LINKS 里明确的路径，其余一律“待匹配”，不硬分配。
const { POLICY_ROWS, POLICY_LIBRARY_SOURCE, JURISDICTION_PROVINCE, PARK_JURISDICTIONS, PATH_LINKS } = __require("src/fixtures/policy-library.mjs");
const ROW = { id: 0, path: 1, name: 2, jurisdiction: 3, level: 4, start: 5, end: 6, category: 7, group: 8, parent: 9, match: 10, doc: 11 };
const PARKS = new Set(PARK_JURISDICTIONS);

function libraryMeta() {
  return {
    imported: POLICY_ROWS.length > 0,
    rows: POLICY_ROWS.length,
    source: POLICY_LIBRARY_SOURCE,
    linkedPaths: Object.keys(PATH_LINKS).length
  };
}

function provinceOf(row) {
  if (row[ROW.level] === '国家级') return null;
  return JURISDICTION_PROVINCE[row[ROW.jurisdiction]] ?? null;
}

function toolsFor(scopeValue, { includeNational = false } = {}) {
  return POLICY_ROWS.filter(row => {
    const province = provinceOf(row);
    if (!province) return includeNational;
    if (scopeValue === '京津冀') return true;
    return province === scopeValue;
  });
}

function libraryCoverage(scopeValue) {
  const rows = toolsFor(scopeValue);
  const national = toolsFor(scopeValue, { includeNational: true }).filter(row => !provinceOf(row)).length;
  const linked = new Set();
  let matched = 0, yearsUnknown = 0, parks = 0, direct = 0, partial = 0;
  const docs = new Set();
  const byPath = new Map();
  for (const row of rows) {
    const link = PATH_LINKS[row[ROW.path]];
    if (link) {
      matched++;
      link.level === 'direct' ? direct++ : partial++;
      for (const id of link.ids) linked.add(id);
    }
    if (row[ROW.start] === null) yearsUnknown++;
    if (row[ROW.doc]) docs.add(row[ROW.doc]);
    if (PARKS.has(row[ROW.jurisdiction])) parks++;
    const entry = byPath.get(row[ROW.path]) || { path: row[ROW.path], count: 0, linked: !!link };
    entry.count++;
    byPath.set(row[ROW.path], entry);
  }
  return {
    imported: POLICY_ROWS.length > 0,
    total: rows.length,
    national,
    matched, pending: rows.length - matched, direct, partial,
    yearsUnknown, parks,
    docCount: docs.size,
    descriptors: [...linked],
    paths: [...byPath.values()].sort((a, b) => b.count - a.count)
  };
}

function pathLink(path) {
  return PATH_LINKS[path] || null;
}

// 某个描述符在本地区有哪些政策条款（只返回已建立关联的；待匹配的不冒充）。
function toolsForDescriptor(scopeValue, descriptorId) {
  return toolsFor(scopeValue).filter(row => (PATH_LINKS[row[ROW.path]]?.ids || []).includes(descriptorId));
}

Object.assign(__exports, { ROW, libraryMeta, toolsFor, libraryCoverage, pathLink, toolsForDescriptor });
},

"src/modules/elements/zones.mjs": (__require, __exports) => {
// 五类业务分区：这是**视图**，不是数据分类的重写。
// 分区依据顶层的框架分组标签映射；没有映射的节点归入「其他（待归类）」，不硬塞。
const ZONES = [
  { id: 'goal', label: '政策目标', hint: '研究要达成什么' },
  { id: 'tech', label: '技术选项', hint: '可选的技术与装备路径' },
  { id: 'constraint', label: '约束条件', hint: '资源、环境等硬约束' },
  { id: 'socio', label: '经济社会', hint: '人口、经济、社会条件' },
  { id: 'regional', label: '区域特征', hint: '空间与终端结构差异' },
  { id: 'other', label: '其他（待归类）', hint: '当前框架没有明确归属' }
];

// 京津冀旧框架的映射（按分组 / 二级小节标签）。旧框架没有分区字段，只能按标签判。
const LABEL_MAP = {
  '政策与治理': 'goal', '区域协同': 'regional', '政策工具': 'goal',
  '产业与技术': 'tech', '工业工艺': 'tech', '减排技术': 'tech', '能源供给': 'tech',
  '资源与环境': 'constraint', '水资源': 'constraint',
  '经济与人口': 'socio', '经济规模': 'socio', '人口': 'socio', '产业结构': 'socio', '能源需求': 'socio',
  '终端部门': 'regional', '建筑用能': 'regional', '交通用能': 'regional'
};

function zoneIndex(project) {
  const nodes = new Map(project.data.taxonomy.map(n => [n.id, n]));
  const memo = new Map();
  const visit = (id, guard = new Set()) => {
    if (memo.has(id)) return memo.get(id);
    const n = nodes.get(id);
    if (!n || guard.has(id)) return 'other';
    let zone = n.zone || LABEL_MAP[n.label] || null;
    if (!zone) {
      const parent = n.parentIds[0] ? visit(n.parentIds[0], new Set([...guard, id])) : null;
      zone = parent || 'other';
    }
    memo.set(id, zone);
    return zone;
  };
  for (const n of nodes.values()) visit(n.id);
  return memo;
}

function taxonomyForZone(project, zoneId) {
  if (!zoneId || zoneId === 'all') return project.data.taxonomy;
  const index = zoneIndex(project), nodes = new Map(project.data.taxonomy.map(n => [n.id, n]));
  const allowed = new Set();
  const addWithAncestors = id => {
    if (allowed.has(id)) return;
    allowed.add(id);
    nodes.get(id)?.parentIds.forEach(addWithAncestors);
  };
  for (const [id, zone] of index) if (zone === zoneId) addWithAncestors(id);
  // 只保留挂得住的子树：父节点不在集合里的节点不能当根随便出现。
  return project.data.taxonomy.filter(n => allowed.has(n.id));
}

function zoneCounts(project) {
  const index = zoneIndex(project);
  const counts = Object.fromEntries(ZONES.map(z => [z.id, 0]));
  for (const node of project.data.taxonomy) if (node.descriptorIds?.length) counts[index.get(node.id) || 'other'] += node.descriptorIds.length;
  return counts;
}

Object.assign(__exports, { ZONES, zoneIndex, taxonomyForZone, zoneCounts });
},

"src/modules/elements/ambition.mjs": (__require, __exports) => {
// current 基准与政策雄心（R07）：基准年状态从状态定义里选，档位顺序单独记录。
// 不从标签猜大小——「降低能耗」也可能是更高雄心，方向必须由使用者标注。
const DIRECTIONS = [
  { id: 'back', label: '回退', note: '比基准更松' },
  { id: 'hold', label: '延续', note: '与基准相当' },
  { id: 'more', label: '强化', note: '比基准更紧' }
];

function ambitionOf(descriptor) {
  const baselineStateId = descriptor?.baseline?.stateId || null;
  const order = Array.isArray(descriptor?.ambition?.order) ? descriptor.ambition.order.filter(id => (descriptor.stateIds || []).includes(id)) : [];
  const full = order.length ? [...order, ...(descriptor.stateIds || []).filter(id => !order.includes(id))] : [...(descriptor.stateIds || [])];
  return { baselineStateId, baseYear: descriptor?.baseline?.year ?? null, source: descriptor?.baseline?.source || null, order: full, explicit: order.length > 0 };
}

function directionOf(descriptor, stateId) {
  const a = ambitionOf(descriptor);
  if (!a.baselineStateId) return null;
  const i = a.order.indexOf(stateId), b = a.order.indexOf(a.baselineStateId);
  if (i < 0 || b < 0) return null;
  return i < b ? 'back' : i === b ? 'hold' : 'more';
}

function directionLabel(descriptor, stateId) {
  const id = directionOf(descriptor, stateId);
  return DIRECTIONS.find(d => d.id === id)?.label || null;
}

function setAmbition(project, descriptorId, { baselineStateId, baseYear, order }) {
  const next = structuredClone(project);
  const descriptor = next.data.descriptors.find(d => d.id === descriptorId);
  if (!descriptor) throw new Error('因素不存在');
  if (baselineStateId !== null && !descriptor.stateIds.includes(baselineStateId)) throw new Error('基准状态不属于这个因素');
  if (order && (order.length !== descriptor.stateIds.length || new Set(order).size !== order.length || order.some(id => !descriptor.stateIds.includes(id)))) throw new Error('档位顺序必须恰好包含这个因素的全部状态');
  descriptor.baseline = baselineStateId ? { stateId: baselineStateId, year: baseYear ?? null, source: 'user-assumption' } : null;
  if (order) descriptor.ambition = { order: [...order] };
  descriptor.version = (descriptor.version || 0) + 1;
  return next;
}

function moveInOrder(order, index, delta) {
  const next = [...order], target = index + delta;
  if (target < 0 || target >= next.length) return next;
  [next[index], next[target]] = [next[target], next[index]];
  return next;
}

Object.assign(__exports, { DIRECTIONS, ambitionOf, directionOf, directionLabel, setAmbition, moveInOrder });
},

  const count = id => LEGACY_MAP.filter(row => row.relation === id).length;
  return {

  return LEGACY_MAP.find(row => row.legacy === legacyId) || null;

  const selected = new Set(project.selection.descriptorIds);

  function paintOne(key){
    const item=cells.get(key);
    if(!item)return;

    const scored=state.kind==='scored';
    item.row.className='relationships-row-cell '+(scored?'relationships-score':'relationships-missing');
    item.row.style.background=scored?'var(--s'+state.score+')':'';
    item.input.setAttribute('aria-invalid',item.input.validity.badInput||state.kind==='invalid'?'true':'false');
    item.table.className=scored?'relationships-score':'relationships-missing';

  }

    if(!readoutLines.size)return;
    const orderedSource=orderedStates('source',sources),orderedTarget=orderedStates('target',targets);
    if(!orderedSource||!orderedTarget)return;
    for(const sourceState of orderedSource){
      const line=readoutLines.get(sourceState.id);
      if(!line)continue;
      line.textContent='源「'+sourceState.label+'」按目标低→中→高：'+orderedTarget.map(targetState=>readRowValue(entryFor(sourceState,targetState)?.value).text).join('、');

  const graphicHost=el('div',{class:'row-guide-sketch-host'});
  function renderGraphic(){
    graphicHost.replaceChildren();
    const shape=MENTOR_SHAPES.find(s=>s.id===graphicSelect.value);
    if(!shape)return;
    graphicHost.append(el('article',{class:'row-guide-sketch','data-row-guide-sketch':shape.id},
      sketchNode(shape.id),
      el('p',{class:'row-guide-sketch-note'},shape.label+(shape.glyphClass?'：'+shape.glyphClass:'')),
      el('p',{class:'row-guide-sketch-note'},MENTOR_SKETCH_NOTE)));

  graphicSelect.addEventListener('change',renderGraphic);
  root.append(el('div',{class:'row-guide-graphic'},el('label',{},'参考趋势图形（仅供参考，不填分数）',graphicSelect),graphicHost));

      const box=el('input',{type:'checkbox','data-order-side':side,onchange:event=>{order[side].on=event.target.checked;run();}});
      box.checked=order[side].on;
      orderHost.append(el('label',{class:'relationships-reference'},box,'我确认「'+(side==='source'?sourceLabel:targetLabel)+'」的三个状态具有顺序（低→中→高）'));
    }

      if(!order[side].on)continue;
      const fields=el('div',{class:'relationships-controls'});
      for(const state of (side==='source'?sources:targets)){
        const select=el('select',{'aria-label':'「'+state.label+'」对应'+(side==='source'?sourceLabel:targetLabel)+'档位',onchange:event=>{order[side].map[state.id]=event.target.value;run();}});
        select.append(el('option',{value:''},'未标明'),...LEVELS.map(level=>el('option',{value:level},level)));
        select.value=order[side].map[state.id]||'';
        fields.append(el('label',{},'「'+state.label+'」对应',select));
      }
      orderHost.append(el('p',{class:'muted'},'请逐档标明低、中、高；同名或同位置的档位不会被自动推断。'),fields);
    }
    readoutLines.clear();
    const orderedSource=orderedStates('source',sources),orderedTarget=orderedStates('target',targets);

      orderHost.append(el('p',{class:'row-guide-order-pending','data-order-assist':'pending'},'有序趋势辅助尚未可用：需要两侧都确认顺序，并把三档分别标为低、中、高。'));
      return;
    }
    const list=el('div',{class:'row-guide-order-readout','data-order-assist':'ready'});
    for(const sourceState of orderedSource){
